name: IA-TB Repository Cleanup

on:
  push:
    paths:
      - '.github/workflows/repo_cleanup_once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply cleanup
        run: python3 .github/repo_cleanup_once.py
      - name: Commit cleanup and diagnostics
        shell: bash
        run: |
          rm -f .github/repo_cleanup_once.py .github/workflows/repo_cleanup_once.yml
          git grep -In -i 'ultra' -- . ':!patchs/**' ':!versions/**' > .github/cleanup_residual.txt || true
          git config user.name 'IA-TB Repository Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(core): complete retired booster purge'
          git push origin HEAD:main
