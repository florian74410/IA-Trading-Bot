name: Import application architecture image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-app-architecture.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Rebuild architecture image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          shas = [
            'dbacbf3013a670711932808e05a98f39986bd46f',
            '3b70ea91fb04712ce22414dc0a412ccd000a7f89',
            'dcae07e3606b9da506f9315d279b431fa26b0e84',
            'd206984321be0fdeaf59ad3b7cba05608cf1d511',
            '73e69d386fd2c3ce157fccd591cb1c172960eb12',
            'af68c69891dce267556859ca8c71def2946a60fa',
            'e7ecc2ddf9ac4d5e702e9215124625e1e3628727',
          ]
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          chunks = []
          for sha in shas:
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/blobs/{sha}',
                  headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json'}
              )
              with urllib.request.urlopen(req) as r:
                  obj = json.load(r)
              chunks.append(base64.b64decode(obj['content']).decode('utf-8'))
          raw = base64.b64decode(''.join(chunks))
          expected_size = 39177
          expected_sha = 'fb642990da910a4ab90f9f5e29617f40cc976ab369b24c33f773e98c6b9ef7e8'
          if len(raw) != expected_size:
              raise SystemExit(f'Unexpected image size: {len(raw)}')
          if hashlib.sha256(raw).hexdigest() != expected_sha:
              raise SystemExit('Architecture image checksum mismatch')
          if not raw.startswith(b'\xff\xd8') or not raw.endswith(b'\xff\xd9'):
              raise SystemExit('Invalid JPEG markers')
          dest = pathlib.Path('docs/assets/app_architecture.jpg')
          dest.parent.mkdir(parents=True, exist_ok=True)
          dest.write_bytes(raw)
          PY

      - name: Update README image source
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          old = 'src="docs/assets/roadmap_architecture_900.png"'
          new = 'src="./docs/assets/app_architecture.jpg"'
          if old not in s and new not in s:
              raise SystemExit('README architecture image marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate result
        run: |
          test -f docs/assets/app_architecture.jpg
          test "$(wc -c < docs/assets/app_architecture.jpg | tr -d ' ')" = "39177"
          grep -F 'src="./docs/assets/app_architecture.jpg"' README.md

      - name: Commit image and README
        run: |
          rm -f .github/workflows/import-app-architecture.yml
          git config user.name 'IA-TB Asset Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md docs/assets/app_architecture.jpg .github/workflows/import-app-architecture.yml
          git commit -m 'docs: add application architecture image'
          git push origin HEAD:main
