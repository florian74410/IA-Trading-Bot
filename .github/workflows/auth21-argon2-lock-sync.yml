name: Auth21 Argon2 lockfile sync (feature branch only)
on:
  push:
    branches:
      - feature/debug-2.1-auth-design
    paths:
      - 'App/package.json'
      - '.github/workflows/auth21-argon2-lock-sync.yml'
permissions:
  contents: write
jobs:
  sync-lockfile:
    if: github.ref == 'refs/heads/feature/debug-2.1-auth-design'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and verify native Argon2 lock
        run: |
          npm --prefix App install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm --prefix App ci --no-audit --no-fund
          node -e "const a=require('./App/node_modules/argon2'); if(typeof a.hash!=='function')process.exit(1)"
      - name: Commit only the deterministic npm lockfile
        run: |
          git add App/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(auth21): synchronize Argon2 native npm lockfile on Node 22"
          git push origin HEAD:feature/debug-2.1-auth-design
