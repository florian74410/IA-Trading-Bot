name: v1.7.9 Finalize Auth and Packages

on:
  push:
    branches: [debug]
    paths:
      - '.github/workflows/v179-finalize-auth-package.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout debug
        uses: actions/checkout@v4
        with:
          ref: debug
          fetch-depth: 1
          persist-credentials: true

      - name: Prepare tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip file

      - name: Switch Auth runtime to valid JPEG background
        run: |
          test -f builds/v1.7.9/Frontend/Assets/IA-TB_Auth_v1.7.9.jpg
          test -f updates/v1.7.9/Frontend/Assets/IA-TB_Auth_v1.7.9.jpg
          file builds/v1.7.9/Frontend/Assets/IA-TB_Auth_v1.7.9.jpg | grep -q 'JPEG image data'
          file updates/v1.7.9/Frontend/Assets/IA-TB_Auth_v1.7.9.jpg | grep -q 'JPEG image data'
          for f in builds/v1.7.9/UserData/runtime_hooks.js updates/v1.7.9/UserData/runtime_hooks.js; do
            sed -i "s/IA-TB_Auth_v1\.7\.9\.png/IA-TB_Auth_v1.7.9.jpg/g; s#data:image/png;base64#data:image/jpeg;base64#g" "$f"
          done
          for f in builds/v1.7.9/UserData/self_test.js updates/v1.7.9/UserData/self_test.js; do
            sed -i "s/IA-TB_Auth_v1\.7\.9\.png/IA-TB_Auth_v1.7.9.jpg/g" "$f"
          done
          rm -f builds/v1.7.9/Frontend/Assets/IA-TB_Auth_v1.7.9.png
          rm -f updates/v1.7.9/Frontend/Assets/IA-TB_Auth_v1.7.9.png
          grep -q 'IA-TB_Auth_v1.7.9.jpg' builds/v1.7.9/UserData/runtime_hooks.js
          grep -q 'data:image/jpeg;base64' builds/v1.7.9/UserData/runtime_hooks.js

      - name: Run v1.7.9 self-test
        run: node builds/v1.7.9/UserData/self_test.js

      - name: Build UpdateManager patch archive
        run: |
          chmod +x updates/v1.7.9/build_patch.command updates/v1.7.9/test_install.command
          cd updates/v1.7.9
          rm -f 'Crypto Chart Viewer IA Trader.zip' 'Crypto Chart Viewer IA Trader.zip.sha256'
          ./build_patch.command
          shasum -a 256 'Crypto Chart Viewer IA Trader.zip' > 'Crypto Chart Viewer IA Trader.zip.sha256'
          unzip -tq 'Crypto Chart Viewer IA Trader.zip'

      - name: Test v1.7.8 to v1.7.9 patch installation
        run: |
          cd updates/v1.7.9
          ./test_install.command

      - name: Build v1.7.9 source archive
        run: |
          mkdir -p archives
          rm -f archives/IA-Trading-Bot_V1.7.9.zip archives/IA-Trading-Bot_V1.7.9.zip.sha256
          (
            cd builds
            zip -qry ../archives/IA-Trading-Bot_V1.7.9.zip v1.7.9 \
              -x 'v1.7.9/.node/*' \
                 'v1.7.9/Runtime/*' \
                 'v1.7.9/**/node_modules/*' \
                 'v1.7.9/Fundamental/Data/*' \
                 'v1.7.9/*.log' \
                 'v1.7.9/**/*.log' \
                 'v1.7.9/logs.dat' \
                 'v1.7.9/Update/*.zip' \
                 'v1.7.9/.DS_Store' \
                 'v1.7.9/**/.DS_Store'
          )
          shasum -a 256 archives/IA-Trading-Bot_V1.7.9.zip > archives/IA-Trading-Bot_V1.7.9.zip.sha256
          unzip -tq archives/IA-Trading-Bot_V1.7.9.zip

      - name: Verify final Git procedure
        run: |
          test -f builds/v1.7.9/Core/Server/server_v1.0.js
          test -f builds/v1.7.9/Frontend/Assets/IA-TB_Auth_v1.7.9.jpg
          test ! -e builds/v1.7.9/Frontend/Assets/IA-TB_Auth_v1.7.9.png
          test -f updates/v1.7.9/Frontend/Assets/IA-TB_Auth_v1.7.9.jpg
          test -f updates/v1.7.9/'Crypto Chart Viewer IA Trader.zip'
          test -f updates/v1.7.9/'Crypto Chart Viewer IA Trader.zip.sha256'
          test -f archives/IA-Trading-Bot_V1.7.9.zip
          test -f archives/IA-Trading-Bot_V1.7.9.zip.sha256
          echo 'FINAL_LAYOUT_OK builds/source updates/patch+archive archives/full-source-archive'

      - name: Commit final v1.7.9 packaging to debug
        run: |
          git config user.name 'IA-TB Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A builds/v1.7.9 updates/v1.7.9 archives/IA-Trading-Bot_V1.7.9.zip archives/IA-Trading-Bot_V1.7.9.zip.sha256
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
          else
            git commit -m 'v1.7.9: finalize build patch archive and Auth background [skip ci]'
            git push origin HEAD:debug
          fi
