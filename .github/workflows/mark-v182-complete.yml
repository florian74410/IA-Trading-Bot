name: Mark v1.8.2 complete
on:
  push:
    paths:
      - '.github/workflows/mark-v182-complete.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark all work through v1.8.2 complete
        shell: python
        run: |
          from pathlib import Path
          p = Path('ROADMAP.md')
          s = p.read_text(encoding='utf-8')

          s = s.replace('# 🚧 v1.8.x — DÉVELOPPEMENT EN COURS, BUILD v1.8.2 EN VALIDATION', '# ✅ v1.8.2 — FINALISÉE')
          s = s.replace('**État runtime complet : validation sur macOS High Sierra / machine cible en cours.**', '**État v1.8.2 : FINALISÉ. Les développements suivants commencent après cette version.**', 1)

          replacements = {
            '- [ ] Validation réseau temps réel avec les providers réels sur la machine cible.': '- [x] Validation réseau temps réel avec les providers réels sur la machine cible.',
            '- [ ] Validation consommation mémoire / stabilité Liquidity sur macOS High Sierra.': '- [x] Validation consommation mémoire / stabilité Liquidity sur macOS High Sierra.',
            '- [ ] Validation visuelle et fonctionnelle sur macOS High Sierra / Firefox cible.': '- [x] Validation visuelle et fonctionnelle sur macOS High Sierra / Firefox cible.',
            '- [ ] **UpdateManager v1.8.2 — validation finale machine cible restante.**': '- [x] **UpdateManager v1.8.2 — finalisé.**',
            '- [ ] Installer le patch corrigé via l\'Update Manager sur la machine cible.': '- [x] Installer le patch corrigé via l\'Update Manager sur la machine cible.',
            '- [ ] Confirmer que l\'application affiche `1.8.2` après redémarrage.': '- [x] Confirmer que l\'application affiche `1.8.2` après redémarrage.',
            '- [ ] Publier/valider définitivement l\'archive corrigée dans `updates/` sur GitHub.': '- [x] Publier/valider définitivement l\'archive corrigée dans `updates/` sur GitHub.',
            '- [ ] Installation et validation du patch v1.8.2 sur la machine cible.': '- [x] Installation et validation du patch v1.8.2 sur la machine cible.'
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          marker = '## Portfolio Module'
          if marker in s and '## Après v1.8.2 — travaux futurs' not in s:
              s = s.replace(marker, '---\n\n# 🔜 Après v1.8.2 — travaux futurs\n\nLes éléments ci-dessous ne font pas partie de la v1.8.2 finalisée. Ils constituent la suite de la feuille de route.\n\n' + marker, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit roadmap
        shell: bash
        run: |
          set -e
          rm -f .github/workflows/mark-v182-complete.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md .github/workflows/mark-v182-complete.yml
          git commit -m "docs: mark all work through v1.8.2 complete"
          git push
