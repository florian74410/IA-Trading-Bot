name: Sync ROADMAP to README

on:
  push:
    branches:
      - main
    paths:
      - 'ROADMAP.md'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Synchronize README roadmap section
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roadmap_path = Path('ROADMAP.md')
          readme_path = Path('README.md')

          roadmap = roadmap_path.read_text(encoding='utf-8').strip()
          readme = readme_path.read_text(encoding='utf-8')

          lines = roadmap.splitlines()
          if lines and lines[0].lstrip().startswith('# '):
              lines = lines[1:]
              while lines and not lines[0].strip():
                  lines.pop(0)
          body = '\n'.join(lines).strip()

          start = '<!-- ROADMAP:START -->'
          end = '<!-- ROADMAP:END -->'
          if start not in readme or end not in readme:
              raise SystemExit('README roadmap markers are missing')

          before, rest = readme.split(start, 1)
          _, after = rest.split(end, 1)
          synced = before + start + '\n' + body + '\n' + end + after
          readme_path.write_text(synced, encoding='utf-8')
          PY

      - name: Commit synchronized README
        run: |
          set -e
          git config user.name "IA-TB Roadmap Sync"
          git config user.email "actions@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: sync README roadmap from ROADMAP.md"
          git push
