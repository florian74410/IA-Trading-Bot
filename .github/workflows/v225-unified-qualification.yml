name: IA-TB v2.2.5 unified patch qualification
on:
  push:
    branches: [feature/v2.2.5-calendar-events-chart]
  pull_request:
    paths:
      - 'App/Frontend/**'
      - 'tests/*v2_2_5*'
      - 'tests/v225_unified_integration.test.cjs'
      - '.github/workflows/v225-unified-qualification.yml'
jobs:
  static-and-contract-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify modified browser scripts parse
        run: |
          for f in \
            App/Frontend/JS/fundamental_globe_bridge_v2_2_5.js \
            App/Frontend/JS/fundamental_globe_expanded_v2_2_5.js \
            App/Frontend/JS/fundamental_globe_v3.js \
            App/Frontend/JS/fundamental_controller_v3.js \
            App/Frontend/JS/chart_controller_native_v1.2.js \
            App/Frontend/JS/chart_economic_events_v2_2_5.js \
            App/Frontend/JS/calendar_events_v2_2_5.js; do
            node --check "$f"
          done
      - name: Test adapter, filters, UI wiring and regression contracts
        run: |
          node --test \
            tests/calendar_events_v2_2_5.test.cjs \
            tests/fundamental_globe_expanded_v2_2_5.test.cjs \
            tests/v225_unified_integration.test.cjs
