name: Update roadmap Risk and Firewall
on:
  push:
    paths:
      - '.github/workflows/update-roadmap-risk-firewall.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update ROADMAP and README
        shell: python
        run: |
          from pathlib import Path
          for name in ['ROADMAP.md','README.md']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              old='- [ ] **Risk Engine — moteur analytique de représentation du risque** — intégré au build v1.8, validation runtime CP/1 restante'
              new='- [x] **Implémentation du Risk Engine** — moteur analytique de représentation du risque intégré ; validation runtime CP/1 end-to-end restante'
              s=s.replace(old,new)
              marker='## Risk Engine\n\n'
              firewall=('## Trading Firewall Module\n\n'
                        '- [x] **Implémentation du Firewall Module** — couche de sécurité du canal `Trading Engine -> Exchanges` conçue et intégrée.\n'
                        '  - [x] Paramétrage `Settings > Trading Firewall` défini.\n'
                        '  - [x] Modes `Protection` et `Observation` définis.\n'
                        '  - [x] Vérification authentification CP, signatures et âge maximal des messages prévue.\n'
                        '  - [x] Command Whitelist définie pour `trading.execute`, `trading.cancel`, `trading.close_position` et `trading.health`.\n'
                        '  - [x] Trading Pair Whitelist intégrée au modèle de configuration.\n'
                        '  - [x] Duplicate Protection avec fenêtre configurable définie.\n'
                        '  - [ ] Validation end-to-end du Firewall sur la machine cible avec les connecteurs réels.\n\n')
              if marker in s and '## Trading Firewall Module' not in s:
                  s=s.replace(marker,firewall+marker,1)
              p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'IA-TB Docs'
          git config user.email 'actions@users.noreply.github.com'
          git add ROADMAP.md README.md
          git rm .github/workflows/update-roadmap-risk-firewall.yml
          git commit -m 'docs: validate Risk Engine and Trading Firewall implementation'
          git push
