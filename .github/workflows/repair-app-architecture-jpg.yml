name: Repair application architecture JPEG

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/repair-app-architecture-jpg.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Pillow
        run: python3 -m pip install --quiet pillow

      - name: Rebuild truncated JPEG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile

          p = Path('docs/assets/app_architecture.jpg')
          raw = p.read_bytes()
          print('stored size:', len(raw))
          if not raw.startswith(b'\xff\xd8'):
              raise SystemExit('No JPEG SOI marker')

          ImageFile.LOAD_TRUNCATED_IMAGES = True
          with Image.open(p) as im:
              print('decoded source:', im.format, im.size, im.mode)
              rgb = im.convert('RGB')
              rgb.save(p, 'JPEG', quality=90, optimize=True, progressive=False)

          fixed = p.read_bytes()
          if not fixed.startswith(b'\xff\xd8') or not fixed.endswith(b'\xff\xd9'):
              raise SystemExit('Rebuilt JPEG markers invalid')
          with Image.open(p) as check:
              check.verify()
          print('rebuilt size:', len(fixed))
          print('SOI:', fixed[:2].hex(), 'EOI:', fixed[-2:].hex())
          PY
          file docs/assets/app_architecture.jpg

      - name: Verify README uses JPEG
        run: grep -F 'docs/assets/app_architecture.jpg' README.md

      - name: Commit repaired image and cleanup
        run: |
          rm .github/workflows/repair-app-architecture-jpg.yml
          git config user.name "IA-TB Release Builder"
          git config user.email "actions@users.noreply.github.com"
          git add docs/assets/app_architecture.jpg .github/workflows/repair-app-architecture-jpg.yml
          git commit -m "assets: reconstruct application architecture JPEG"
          git push origin main
