name: Repair application architecture JPEG

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/repair-app-architecture-jpg.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair JPEG container
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/assets/app_architecture.jpg')
          data = p.read_bytes()
          soi = data.find(b'\xff\xd8')
          eoi = data.rfind(b'\xff\xd9')
          if soi < 0 or eoi < 0 or eoi <= soi:
              raise SystemExit('Invalid JPEG markers')
          fixed = data[soi:eoi+2]
          p.write_bytes(fixed)
          print('old size:', len(data))
          print('new size:', len(fixed))
          print('SOI:', fixed[:2].hex(), 'EOI:', fixed[-2:].hex())
          PY
          file docs/assets/app_architecture.jpg
          if command -v identify >/dev/null 2>&1; then
            identify docs/assets/app_architecture.jpg
          fi

      - name: Verify README uses repaired JPEG
        run: |
          grep -F 'docs/assets/app_architecture.jpg' README.md

      - name: Commit repaired image
        run: |
          rm .github/workflows/repair-app-architecture-jpg.yml
          git config user.name "IA-TB Release Builder"
          git config user.email "actions@users.noreply.github.com"
          git add docs/assets/app_architecture.jpg .github/workflows/repair-app-architecture-jpg.yml
          git commit -m "assets: repair application architecture JPEG"
          git push origin main
