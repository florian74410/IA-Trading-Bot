name: Build IA-Trading-Bot v1.7.7

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-v1.7.7.yml"
      - "Update/BUILD_v1.7.7.trigger"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct v1.7.7 source delta
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .rebuild
          mkdir -p .rebuild/unpacked .rebuild/patch-package
          cat Update/v1.7.7/.delta/part_* | base64 --decode | gzip -dc > .rebuild/v1.7.7.patch
          test -s .rebuild/v1.7.7.patch
          grep -q 'services/trading-engine/trading_service.js' .rebuild/v1.7.7.patch

      - name: Apply v1.7.7 delta to current v1.7.6 archive
        shell: bash
        run: |
          set -euo pipefail
          unzip -q IA-Trading-Bot_V1.7.6.zip -d .rebuild/unpacked

          APPROOT=".rebuild/unpacked"
          if [ ! -d "$APPROOT/services" ]; then
            shopt -s nullglob dotglob
            children=("$APPROOT"/*)
            shopt -u dotglob
            if [ "${#children[@]}" -eq 1 ] && [ -d "${children[0]}" ]; then
              APPROOT="${children[0]}"
            fi
          fi

          (cd "$APPROOT" && patch -p1 --batch --forward < "$GITHUB_WORKSPACE/.rebuild/v1.7.7.patch")

          # The CP secret is installation-local and must never be distributed.
          rm -f "$APPROOT/Parametres/CommunicationProtocol.dat"
          rm -f "$APPROOT/user.dat" "$APPROOT/secrets_v2.dat" "$APPROOT/logs.dat"
          find "$APPROOT" -type f -name '*.log' -delete

          # Preserve macOS launcher executability after extraction/repackaging.
          find "$APPROOT" -type f \( -name '*.command' -o -name '*.sh' \) -exec chmod 755 {} +

          test "$(tr -d '\r\n' < "$APPROOT/VERSION")" = "1.7.7"
          grep -q '"version": "1.7.7"' "$APPROOT/Updates/current_release.dat"
          grep -q '"version": "1.7.7"' "$APPROOT/manifest.json"
          test -f "$APPROOT/services/trading-engine/trading_service.js"
          printf '%s\n' "$APPROOT" > .rebuild/app_root.txt

      - name: Package installable v1.7.7 patch
        shell: bash
        run: |
          set -euo pipefail
          APPROOT="$(cat .rebuild/app_root.txt)"
          PATCHROOT="$GITHUB_WORKSPACE/.rebuild/patch-package"
          rm -rf "$PATCHROOT"
          mkdir -p "$PATCHROOT"

          while IFS= read -r rel; do
            [ -n "$rel" ] || continue
            test -f "$APPROOT/$rel"
            mkdir -p "$PATCHROOT/$(dirname "$rel")"
            cp -p "$APPROOT/$rel" "$PATCHROOT/$rel"
          done < Update/v1.7.7/PATCH_FILES.txt

          rm -f Update/v1.7.7/Crypto-Chart-Viewer-IA-Trader-v1.7.7-update.zip
          (cd "$PATCHROOT" && zip -qr "$GITHUB_WORKSPACE/Update/v1.7.7/Crypto-Chart-Viewer-IA-Trader-v1.7.7-update.zip" .)
          sha256sum Update/v1.7.7/Crypto-Chart-Viewer-IA-Trader-v1.7.7-update.zip \
            | sed 's#Update/v1.7.7/##' \
            | tee Update/v1.7.7/PATCH_SHA256.txt
          unzip -tq Update/v1.7.7/Crypto-Chart-Viewer-IA-Trader-v1.7.7-update.zip

      - name: Validate v1.7.7 runtime and Trading Engine
        shell: bash
        run: |
          set -euo pipefail
          APPROOT="$(cat .rebuild/app_root.txt)"

          node --check "$APPROOT/services/trading-engine/trading_service.js"
          find "$APPROOT/services/trading-engine" -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node "$APPROOT/services/trading-engine/self-test.js"
          node --check "$APPROOT/Core/Communication/communication_router_v1.js"
          node --check "$APPROOT/Core/Router/router.js"
          node --check "$APPROOT/Core/Admin/service_registry.js"
          node --check "$APPROOT/Core/Admin/admin_backend.js"
          node --check "$APPROOT/Core/Server/server_v1.0.js"
          bash -n "$APPROOT/start.command"
          bash -n "$APPROOT/stop.command"

          # Smoke-test the supervised Trading Engine in SAFE mode.
          (
            cd "$APPROOT"
            IATB_TRADING_ENGINE_PORT=18016 IATB_TRADING_LIVE=0 node services/trading-engine/trading_service.js > /tmp/iatb-trading-177.log 2>&1 &
            TPID=$!
            trap 'kill "$TPID" 2>/dev/null || true' EXIT
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:18016/health > /tmp/iatb-trading-health.json; then break; fi
              sleep 0.2
            done
            grep -q '"ok":true' /tmp/iatb-trading-health.json
            grep -q '"version":"1.7.7"' /tmp/iatb-trading-health.json
            grep -q '"liveExecutionEnabled":false' /tmp/iatb-trading-health.json
            grep -q '"registeredExchangeCount":4' /tmp/iatb-trading-health.json
            kill "$TPID" 2>/dev/null || true
            wait "$TPID" 2>/dev/null || true
            trap - EXIT
          )

      - name: Build full v1.7.7 archive and extracted Build
        shell: bash
        run: |
          set -euo pipefail
          APPROOT="$(cat .rebuild/app_root.txt)"

          # Remove test/runtime state generated by validation before distribution.
          rm -f "$APPROOT/Parametres/CommunicationProtocol.dat"
          rm -f "$APPROOT/user.dat" "$APPROOT/secrets_v2.dat" "$APPROOT/logs.dat"
          find "$APPROOT" -type f -name '*.log' -delete

          rm -rf Build/v1.7.7
          mkdir -p Build/v1.7.7
          cp -a "$APPROOT"/. Build/v1.7.7/

          # Security assertions on the distributable tree.
          test ! -e Build/v1.7.7/Parametres/CommunicationProtocol.dat
          test ! -e Build/v1.7.7/user.dat
          test ! -e Build/v1.7.7/secrets_v2.dat
          test ! -e Build/v1.7.7/logs.dat
          if find Build/v1.7.7 -type f -name '*.log' | grep -q .; then
            echo 'Unexpected log file in Build/v1.7.7' >&2
            exit 1
          fi

          rm -f IA-Trading-Bot_V1.7.7.zip
          (cd "$APPROOT" && zip -qr "$GITHUB_WORKSPACE/IA-Trading-Bot_V1.7.7.zip" .)
          sha256sum IA-Trading-Bot_V1.7.7.zip | tee Update/v1.7.7/FULL_ARCHIVE_SHA256.txt
          printf '1.7.7\n' > VERSION

          python3 - <<'PY'
          import json, zipfile
          p='IA-Trading-Bot_V1.7.7.zip'
          with zipfile.ZipFile(p) as z:
              assert z.read('VERSION').decode().strip() == '1.7.7'
              assert json.loads(z.read('Updates/current_release.dat'))['version'] == '1.7.7'
              assert json.loads(z.read('manifest.json'))['version'] == '1.7.7'
              names=set(z.namelist())
              assert 'Parametres/CommunicationProtocol.dat' not in names
              assert 'services/trading-engine/trading_service.js' in names
              for name in ('start.command','install_runtime.command','stop.command'):
                  mode=(z.getinfo(name).external_attr >> 16) & 0o777
                  assert mode & 0o111, (name, oct(mode))
          print('v1.7.7 archive validation: PASS')
          PY

      - name: Publish full v1.7.7 archive
        uses: actions/upload-artifact@v4
        with:
          name: IA-Trading-Bot_V1.7.7
          path: IA-Trading-Bot_V1.7.7.zip
          if-no-files-found: error
          retention-days: 30

      - name: Commit v1.7.7 patch archive, full archive and Build extraction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION IA-Trading-Bot_V1.7.7.zip \
            Update/v1.7.7/Crypto-Chart-Viewer-IA-Trader-v1.7.7-update.zip \
            Update/v1.7.7/PATCH_SHA256.txt \
            Update/v1.7.7/FULL_ARCHIVE_SHA256.txt
          git add -f Build/v1.7.7
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "release: build IA-Trading-Bot v1.7.7 with Trading Engine runtime"
          git push origin HEAD:main
