name: Set README app architecture SVG

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/set-readme-app-architecture-svg.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace architecture image source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          s=p.read_text(encoding='utf-8')
          old='<img src="./docs/assets/app_architecture.jpg" alt="IA-Trading-Bot architecture" width="100%" />'
          new='<img src="./docs/assets/app_architecture.svg" alt="IA-Trading-Bot architecture" width="100%" />'
          if old not in s and new not in s:
              raise SystemExit('Expected README image tag not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          rm -f .github/workflows/set-readme-app-architecture-svg.yml
          git config user.name 'IA-TB Asset Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md .github/workflows/set-readme-app-architecture-svg.yml
          git commit -m 'docs: display app architecture SVG in README'
          git push origin HEAD:main
