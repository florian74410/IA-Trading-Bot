name: IA-TB 2.5 Risk R1 R2 targeted validation
on:
  push:
    branches: ['2.5', '2.5.1']
  pull_request:
    branches: ['2.5', '2.5.1']
permissions:
  contents: read
jobs:
  risk:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source syntax
        run: |
          node --check App/Risk/Engine/risk_r1_modules.js
          node --check App/Risk/Engine/risk_r2_modules.js
          node --check App/Risk/Engine/risk_settings_v25.js
          node --check App/Risk/Engine/risk_service.js
          node --check App/Core/Server/server.js
          node --check App/Frontend/JS/settings.js
      - name: Unit and security contract tests
        run: node --test --test-concurrency=1 App/Risk/Tests/test_risk_r1_r2_v25.js App/Risk/Tests/test_risk_settings_v25.js
      - name: Metadata coherence
        run: node App/Tools_validate_release_version.js
