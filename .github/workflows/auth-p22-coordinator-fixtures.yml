      - 'App/Core/Services/usage_ledger_v1.js'
      - 'App/Tools/Tests/trading_usage_jsonl_snapshot_writers.test.js'
      - 'App/Core/Mosaics/mosaic_store_v1.0.js'
      - 'App/Tools/Tests/mosaic_snapshot_writer.test.js'
      - 'App/Core/Clients/client_crypto.js'
      - 'App/Tools/Tests/client_master_key_safety.test.js'
      - 'App/Core/Clients/auth21_proposed_migrations/003_auth21_schema_v3.sql'
      - 'App/Tools/CI/test_auth21_schema_v3_proposal.py'
      - 'App/Tools/CI/auth21_v3_migration_trial.js'
      - 'App/Tools/CI/auth21_credential_upgrade_trial.js'
      - 'App/Tools/Tests/auth21_v3_migration_trial.test.js'
      - 'App/Core/Clients/password_hasher_v2.js'
      - 'App/Core/Clients/auth21_session_store.js'
      - 'App/Tools/Tests/auth21_session_store.test.js'
      - 'App/Core/Clients/auth21_admin_store.js'
      - 'App/Tools/Tests/auth21_admin_store.test.js'
      - '.github/workflows/auth-p22-coordinator-fixtures.yml'
  pull_request:
    branches:
      - debug
      - fix/v2.0.1-debug
      - feature/debug-2.1-auth-design
    paths:
      - 'App/Core/Backup/snapshot_coordinator.js'
      - 'App/Tools/Tests/snapshot_coordinator.test.js'
      - 'App/Tools/Tests/core_snapshot_writers.test.js'
      - 'App/Core/Clients/client_repository.js'
      - 'App/Core/Settings/sqlite_settings_store.js'
      - 'App/Portfolio/Engine/portfolio_store.js'
      - 'App/Tools/Tests/portfolio_snapshot_writer.test.js'
      - 'App/Fundamental/Engine/database_core.js'
      - 'App/Tools/Tests/fundamental_snapshot_writer.test.js'
      - 'App/Fundamental/Engine/database.js'
      - 'App/Tools/Tests/fundamental_legacy_snapshot_bridge.test.js'
      - 'App/MarketData/Registry/market_registry.js'
      - 'App/MarketData/Storage/api_telemetry_store.js'
      - 'App/MarketData/Storage/microstructure_store.js'
      - 'App/Tools/Tests/marketdata_snapshot_writers.test.js'
      - 'App/MarketData/Financial/financial_store.js'
      - 'App/Tools/Tests/financial_jsonl_snapshot_writer.test.js'
      - 'App/services/trading-engine/history-store.js'
      - 'App/Core/Services/usage_ledger_v1.js'
      - 'App/Tools/Tests/trading_usage_jsonl_snapshot_writers.test.js'
      - 'App/Core/Mosaics/mosaic_store_v1.0.js'
      - 'App/Tools/Tests/mosaic_snapshot_writer.test.js'
      - 'App/Core/Clients/client_crypto.js'
      - 'App/Tools/Tests/client_master_key_safety.test.js'
      - 'App/Core/Clients/auth21_proposed_migrations/003_auth21_schema_v3.sql'
      - 'App/Tools/CI/test_auth21_schema_v3_proposal.py'
      - 'App/Tools/CI/auth21_v3_migration_trial.js'
      - 'App/Tools/CI/auth21_credential_upgrade_trial.js'
      - 'App/Tools/Tests/auth21_v3_migration_trial.test.js'
      - 'App/Core/Clients/password_hasher_v2.js'
      - 'App/Core/Clients/auth21_session_store.js'
      - 'App/Tools/Tests/auth21_session_store.test.js'
      - 'App/Core/Clients/auth21_admin_store.js'
      - 'App/Tools/Tests/auth21_admin_store.test.js'
      - '.github/workflows/auth-p22-coordinator-fixtures.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-coordinator-tests:
    name: P2.2 isolated coordinator - no services or real data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check App/Core/Backup/snapshot_coordinator.js
          node --check App/Tools/Tests/snapshot_coordinator.test.js
          node --check App/Tools/Tests/core_snapshot_writers.test.js
          node --check App/Core/Clients/client_repository.js
          node --check App/Core/Settings/sqlite_settings_store.js
          node --check App/Portfolio/Engine/portfolio_store.js
          node --check App/Tools/Tests/portfolio_snapshot_writer.test.js
          node --check App/Fundamental/Engine/database_core.js
          node --check App/Tools/Tests/fundamental_snapshot_writer.test.js
          node --check App/Fundamental/Engine/database.js
          node --check App/Tools/Tests/fundamental_legacy_snapshot_bridge.test.js
          node --check App/MarketData/Registry/market_registry.js
          node --check App/MarketData/Storage/api_telemetry_store.js
          node --check App/MarketData/Storage/microstructure_store.js
          node --check App/Tools/Tests/marketdata_snapshot_writers.test.js
          node --check App/MarketData/Financial/financial_store.js
          node --check App/Tools/Tests/financial_jsonl_snapshot_writer.test.js
          node --check App/services/trading-engine/history-store.js
          node --check App/Core/Services/usage_ledger_v1.js
          node --check App/Tools/Tests/trading_usage_jsonl_snapshot_writers.test.js
          node --check App/Core/Mosaics/mosaic_store_v1.0.js
          node --check App/Tools/Tests/mosaic_snapshot_writer.test.js
          node --check App/Core/Clients/client_crypto.js
          node --check App/Tools/Tests/client_master_key_safety.test.js
          node --check App/Tools/CI/auth21_v3_migration_trial.js
          node --check App/Tools/CI/auth21_credential_upgrade_trial.js
          node --check App/Tools/Tests/auth21_v3_migration_trial.test.js
          node --check App/Core/Clients/auth21_session_store.js
          node --check App/Tools/Tests/auth21_session_store.test.js
          node --check App/Core/Clients/auth21_admin_store.js
          node --check App/Tools/Tests/auth21_admin_store.test.js
      - name: Isolated ACK and failure-handling fixtures
        run: node --test App/Tools/Tests/snapshot_coordinator.test.js App/Tools/Tests/core_snapshot_writers.test.js App/Tools/Tests/portfolio_snapshot_writer.test.js App/Tools/Tests/fundamental_snapshot_writer.test.js App/Tools/Tests/fundamental_legacy_snapshot_bridge.test.js App/Tools/Tests/marketdata_snapshot_writers.test.js App/Tools/Tests/financial_jsonl_snapshot_writer.test.js App/Tools/Tests/trading_usage_jsonl_snapshot_writers.test.js App/Tools/Tests/mosaic_snapshot_writer.test.js App/Tools/Tests/client_master_key_safety.test.js
      - name: Auth v3 offline SQLite schema fixtures (no live databases)
        run: python3 App/Tools/CI/test_auth21_schema_v3_proposal.py
      - name: Install SQLite and Argon2 into runner temp directory
        run: npm --prefix "$RUNNER_TEMP/iatb-auth-v3" install --no-save --no-package-lock --no-audit --no-fund better-sqlite3@12.4.1 argon2@0.45.1
      - name: Verify native v3 migration and credential CAS on fixtures
        run: NODE_PATH="$RUNNER_TEMP/iatb-auth-v3/node_modules" node --test App/Tools/Tests/auth21_v3_migration_trial.test.js
      - name: Auth v3 session, revocation and encrypted preference fixtures
        run: NODE_PATH="$RUNNER_TEMP/iatb-auth-v3/node_modules" node --test App/Tools/Tests/auth21_session_store.test.js
      - name: Auth v3 ADMIN persistence, last-admin guard and local-CLI fixtures
        run: NODE_PATH="$RUNNER_TEMP/iatb-auth-v3/node_modules" node --test App/Tools/Tests/auth21_admin_store.test.js
