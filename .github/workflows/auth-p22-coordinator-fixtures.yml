name: Auth P2.2 Coordinator Fixture Tests

on:
  push:
    branches:
      - feature/debug-2.1-auth-design
    paths:
      - 'App/Core/Backup/snapshot_coordinator.js'
      - 'App/Tools/Tests/snapshot_coordinator.test.js'
      - 'App/Tools/Tests/core_snapshot_writers.test.js'
      - 'App/Core/Clients/client_repository.js'
      - 'App/Core/Settings/sqlite_settings_store.js'
      - 'App/Portfolio/Engine/portfolio_store.js'
      - 'App/Tools/Tests/portfolio_snapshot_writer.test.js'
      - 'App/Fundamental/Engine/database_core.js'
      - 'App/Tools/Tests/fundamental_snapshot_writer.test.js'
      - 'App/Fundamental/Engine/database.js'
      - 'App/Tools/Tests/fundamental_legacy_snapshot_bridge.test.js'
      - 'App/MarketData/Registry/market_registry.js'
      - 'App/MarketData/Storage/api_telemetry_store.js'
      - 'App/MarketData/Storage/microstructure_store.js'
      - 'App/Tools/Tests/marketdata_snapshot_writers.test.js'
      - '.github/workflows/auth-p22-coordinator-fixtures.yml'
  pull_request:
    branches:
      - debug
      - fix/v2.0.1-debug
      - feature/debug-2.1-auth-design
    paths:
      - 'App/Core/Backup/snapshot_coordinator.js'
      - 'App/Tools/Tests/snapshot_coordinator.test.js'
      - 'App/Tools/Tests/core_snapshot_writers.test.js'
      - 'App/Core/Clients/client_repository.js'
      - 'App/Core/Settings/sqlite_settings_store.js'
      - 'App/Portfolio/Engine/portfolio_store.js'
      - 'App/Tools/Tests/portfolio_snapshot_writer.test.js'
      - 'App/Fundamental/Engine/database_core.js'
      - 'App/Tools/Tests/fundamental_snapshot_writer.test.js'
      - 'App/Fundamental/Engine/database.js'
      - 'App/Tools/Tests/fundamental_legacy_snapshot_bridge.test.js'
      - 'App/MarketData/Registry/market_registry.js'
      - 'App/MarketData/Storage/api_telemetry_store.js'
      - 'App/MarketData/Storage/microstructure_store.js'
      - 'App/Tools/Tests/marketdata_snapshot_writers.test.js'
      - '.github/workflows/auth-p22-coordinator-fixtures.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-coordinator-tests:
    name: P2.2 isolated coordinator - no services or real data
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check App/Core/Backup/snapshot_coordinator.js
          node --check App/Tools/Tests/snapshot_coordinator.test.js
          node --check App/Tools/Tests/core_snapshot_writers.test.js
          node --check App/Core/Clients/client_repository.js
          node --check App/Core/Settings/sqlite_settings_store.js
          node --check App/Portfolio/Engine/portfolio_store.js
          node --check App/Tools/Tests/portfolio_snapshot_writer.test.js
          node --check App/Fundamental/Engine/database_core.js
          node --check App/Tools/Tests/fundamental_snapshot_writer.test.js
          node --check App/Fundamental/Engine/database.js
          node --check App/Tools/Tests/fundamental_legacy_snapshot_bridge.test.js
          node --check App/MarketData/Registry/market_registry.js
          node --check App/MarketData/Storage/api_telemetry_store.js
          node --check App/MarketData/Storage/microstructure_store.js
          node --check App/Tools/Tests/marketdata_snapshot_writers.test.js
      - name: Isolated ACK and failure-handling fixtures
        run: node --test App/Tools/Tests/snapshot_coordinator.test.js App/Tools/Tests/core_snapshot_writers.test.js App/Tools/Tests/portfolio_snapshot_writer.test.js App/Tools/Tests/fundamental_snapshot_writer.test.js App/Tools/Tests/fundamental_legacy_snapshot_bridge.test.js App/Tools/Tests/marketdata_snapshot_writers.test.js
