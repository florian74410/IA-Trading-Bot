      - name: Isolated ACK and failure-handling fixtures
        run: node --test App/Tools/Tests/snapshot_coordinator.test.js App/Tools/Tests/auth21_snapshot_recovery.test.js App/Tools/Tests/auth21_durable_snapshot_writer.test.js App/Tools/Tests/auth21_portfolio_real_gate.test.js App/Tools/Tests/auth21_marketdata_real_gate.test.js App/Tools/Tests/auth21_fundamental_real_gate.test.js App/Tools/Tests/core_snapshot_writers.test.js App/Tools/Tests/portfolio_snapshot_writer.test.js App/Tools/Tests/fundamental_snapshot_writer.test.js App/Tools/Tests/fundamental_legacy_snapshot_bridge.test.js App/Tools/Tests/marketdata_snapshot_writers.test.js App/Tools/Tests/financial_jsonl_snapshot_writer.test.js App/Tools/Tests/trading_usage_jsonl_snapshot_writers.test.js App/Tools/Tests/mosaic_snapshot_writer.test.js App/Tools/Tests/client_master_key_safety.test.js
      - name: Startup paths read-only preflight and reviewed writer inventory
        run: node --test App/Tools/Tests/auth21_paths_startup_preflight.test.js App/Tools/Tests/auth21_writer_inventory.test.js App/Tools/Tests/auth21_core_local_trial_wiring.test.js App/Tools/Tests/auth21_core_updates_read_only_trial.test.js
      - name: Auth v3 offline SQLite schema fixtures (no live databases)
        run: python3 App/Tools/CI/test_auth21_schema_v3_proposal.py
      - name: Verify production npm lockfile and native Argon2 with Node 22
        run: |
          npm --prefix App ci --no-audit --no-fund
          node -e "const p=require('./App/package.json');const lock=require('./App/package-lock.json');if(p.dependencies.argon2!=='0.45.1'||lock.packages[''].dependencies.argon2!=='0.45.1'||lock.packages['node_modules/argon2'].version!=='0.45.1')process.exit(1);if(typeof require('./App/node_modules/argon2').hash!=='function')process.exit(2)"
      - name: Real Engine processes reject unauthorized HTTP CP1 Upgrade and CONNECT
        run: node --test App/Tools/Tests/auth21_real_engines_ingress.test.js
      - name: Signed snapshot IPC for three real Engine processes
        run: node --test App/Tools/Tests/auth21_snapshot_real_service_ipc.test.js
      - name: Argon2id 64 MiB 3-pass calibration on CI runner (not GEN-1)
        run: |
          node - <<'NODE'
          const {performance}=require('node:perf_hooks');
          const argon2=require('./App/node_modules/argon2');
          (async()=>{
            const ms=[];
            for(let i=0;i<3;i++){
              const start=performance.now();
              const digest=await argon2.hash('BENCHMARK_ONLY_NOT_A_SECRET',{type:argon2.argon2id,memoryCost:65536,timeCost:3,parallelism:1,hashLength:32});
              if(!await argon2.verify(digest,'BENCHMARK_ONLY_NOT_A_SECRET'))throw Error('ARGON2_CALIBRATION_VERIFY_FAILED');
              ms.push(Math.round(performance.now()-start));
            }
            console.log(JSON.stringify({profile:'CI_UBUNTU_NODE22_NOT_GEN1',iterations:3,memoryMiB:64,passes:3,parallelism:1,durationsMs:ms,maxRssMiB:Math.round(process.resourceUsage().maxRSS/1024)}));
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
      - name: Install SQLite and Argon2 into runner temp directory
        run: npm --prefix "$RUNNER_TEMP/iatb-auth-v3" install --no-save --no-package-lock --no-audit --no-fund better-sqlite3@12.4.1 argon2@0.45.1
      - name: Verify native v3 migration and credential CAS on fixtures
        run: NODE_PATH="$RUNNER_TEMP/iatb-auth-v3/node_modules" node --test App/Tools/Tests/auth21_v3_migration_trial.test.js
      - name: Auth v3 session, revocation and encrypted preference fixtures
        run: NODE_PATH="$RUNNER_TEMP/iatb-auth-v3/node_modules" node --test App/Tools/Tests/auth21_session_store.test.js
      - name: Auth21 isolated HTTP bearer boundary negative tests
