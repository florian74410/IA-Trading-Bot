name: ChartViewer Studio Drawing V2.1
on:
  push:
    branches: [feature/chartviewer-studio-drawing-v2.1]
  pull_request:
    paths:
      - 'App/Frontend/**'
      - 'App/UI/Tests/**'
      - '.github/workflows/chart-workspace-v21-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev --no-audit --no-fund
        working-directory: App
      - run: npm install --prefix /tmp/chart-qa --no-audit --no-fund playwright@1.62.1
      - run: /tmp/chart-qa/node_modules/.bin/playwright install --with-deps firefox
      - name: Core contracts and computations (registry fixtures run sequentially)
        run: >-
          node --test --test-concurrency=1
          App/Indicators/Tests/test_indicator_engine.js
          App/Indicators/Tests/test_indicator_settings_v1.js
          App/Indicators/Tests/test_indicator_complete_v2.js
          App/Indicators/Tests/test_indicator_ir_v2.js
          App/Indicators/Tests/test_indicator_language_v2.js
          App/Indicators/Tests/test_indicator_analysis_v1.js
          App/Core/Communication/Tests/test_communication_router_v1.js
          App/UI/Tests/test_indicator_visual_v2.js
          App/UI/Tests/test_ui_contract_v2.js
          App/UI/Tests/test_ui_routes_v2.js
          App/UI/Tests/test_architecture_boundaries_v2.0.js
          App/UI/Tests/test_engine_http_surface_v2.0.js
          App/UI/Tests/test_marketdata_v2.0.js
      - name: Firefox interactions and fixture screenshots
        env:
          NODE_PATH: /tmp/chart-qa/node_modules
          IATB_QA_SCREENSHOTS: '1'
        run: node --test App/UI/Tests/test_trading_indicators_v204.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chart-workspace-firefox
          path: /tmp/iatb-ui-*.png
