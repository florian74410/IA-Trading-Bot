name: v1.7.9 Package Sync

on:
  push:
    branches: [debug]
    paths:
      - '.github/workflows/v179-package-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout debug
        uses: actions/checkout@v4
        with:
          ref: debug
          fetch-depth: 1
          persist-credentials: true

      - name: Prepare tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip
          python3 -m pip install --break-system-packages pillow

      - name: Fix Auth background asset format
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src = Path('Docs/Assets/IA-TB_Auth_v1.7.9.png')
          targets = [
              Path('builds/v1.7.9/Frontend/Assets/IA-TB_Auth_v1.7.9.png'),
              Path('updates/v1.7.9/Frontend/Assets/IA-TB_Auth_v1.7.9.png'),
          ]
          if not src.exists():
              raise SystemExit('Missing source Auth artwork: %s' % src)
          with Image.open(src) as im:
              rgb = im.convert('RGB')
              for dst in targets:
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  rgb.save(dst, format='PNG', optimize=True)
                  with Image.open(dst) as check:
                      if check.format != 'PNG' or check.size != rgb.size:
                          raise SystemExit('Invalid converted Auth asset: %s' % dst)
                      print('AUTH_ASSET_OK', dst, check.format, check.size)
          PY
          file builds/v1.7.9/Frontend/Assets/IA-TB_Auth_v1.7.9.png
          file updates/v1.7.9/Frontend/Assets/IA-TB_Auth_v1.7.9.png

      - name: Run v1.7.9 self-test
        run: |
          node builds/v1.7.9/UserData/self_test.js

      - name: Build UpdateManager patch archive
        run: |
          chmod +x updates/v1.7.9/build_patch.command updates/v1.7.9/test_install.command
          cd updates/v1.7.9
          ./build_patch.command
          shasum -a 256 'Crypto Chart Viewer IA Trader.zip' > 'Crypto Chart Viewer IA Trader.zip.sha256'
          unzip -tq 'Crypto Chart Viewer IA Trader.zip'

      - name: Test v1.7.8 to v1.7.9 patch install
        run: |
          cd updates/v1.7.9
          ./test_install.command

      - name: Build v1.7.9 source archive
        run: |
          rm -f archives/IA-Trading-Bot_V1.7.9.zip archives/IA-Trading-Bot_V1.7.9.zip.sha256
          mkdir -p archives
          (
            cd builds
            zip -qry ../archives/IA-Trading-Bot_V1.7.9.zip v1.7.9 \
              -x 'v1.7.9/.node/*' \
                 'v1.7.9/Runtime/*' \
                 'v1.7.9/**/node_modules/*' \
                 'v1.7.9/Fundamental/Data/*' \
                 'v1.7.9/*.log' \
                 'v1.7.9/**/*.log' \
                 'v1.7.9/logs.dat' \
                 'v1.7.9/Update/*.zip' \
                 'v1.7.9/.DS_Store' \
                 'v1.7.9/**/.DS_Store'
          )
          shasum -a 256 archives/IA-Trading-Bot_V1.7.9.zip > archives/IA-Trading-Bot_V1.7.9.zip.sha256
          unzip -tq archives/IA-Trading-Bot_V1.7.9.zip

      - name: Verify Git layout
        run: |
          test -f builds/v1.7.9/Core/Server/server_v1.0.js
          test -f builds/v1.7.9/Frontend/Assets/IA-TB_Auth_v1.7.9.png
          test -f updates/v1.7.9/'Crypto Chart Viewer IA Trader.zip'
          test -f updates/v1.7.9/'Crypto Chart Viewer IA Trader.zip.sha256'
          test -f archives/IA-Trading-Bot_V1.7.9.zip
          test -f archives/IA-Trading-Bot_V1.7.9.zip.sha256
          echo 'GIT_LAYOUT_OK build=source patch=updates archive=archives'

      - name: Commit packaged v1.7.9 to debug
        run: |
          git config user.name 'IA-TB Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            builds/v1.7.9/Frontend/Assets/IA-TB_Auth_v1.7.9.png \
            updates/v1.7.9/Frontend/Assets/IA-TB_Auth_v1.7.9.png \
            updates/v1.7.9/'Crypto Chart Viewer IA Trader.zip' \
            updates/v1.7.9/'Crypto Chart Viewer IA Trader.zip.sha256' \
            archives/IA-Trading-Bot_V1.7.9.zip \
            archives/IA-Trading-Bot_V1.7.9.zip.sha256
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
          else
            git commit -m 'v1.7.9: sync build patch archive and Auth background [skip ci]'
            git push origin HEAD:debug
          fi
