name: Repair Firewall Refactor Workflow
on: [push]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug
          fetch-depth: 0
      - name: Repair and push
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/firewall-refactor-v112.yml')
          s=p.read_text()
          old="    if: github.event.head_commit.message == 'chore(debug): stage firewall v1.12 refactor workflow'\n"
          if old not in s:
              raise SystemExit('target if line missing')
          s=s.replace(old, "    if: ${{ github.event.head_commit.message == 'chore(debug): repair firewall refactor workflow syntax' }}\n")
          p.write_text(s)
          PY
          git rm .github/workflows/firewall-workflow-fix.yml
          git config user.name "0v3r-F10w"
          git config user.email "florianbeckert.74@outlook.fr"
          git add .github/workflows/firewall-refactor-v112.yml
          git commit -m "chore(debug): repair firewall refactor workflow syntax"
          git push origin debug
