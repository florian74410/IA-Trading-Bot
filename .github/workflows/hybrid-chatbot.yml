name: Hybrid ChatBot dev.5 qualification
on:
  push:
    branches: ['feature/iatb-2.6.0-dev.5-hybrid-chatbot']
  pull_request:
    paths: ['App/Supervisor/ChatBot/**', 'Documentation/ChatBot/**', '.github/workflows/hybrid-chatbot.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev --no-audit --no-fund
        working-directory: App
      - run: node App/Tools_validate_release_version.js
      - run: node App/Tools/Tests/SupervisorSimulator/run_validation.js /tmp/iatb-chatbot-validation
      - run: npm install --prefix /tmp/iatb-browser --no-audit --no-fund playwright@1.62.1
      - run: /tmp/iatb-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: node App/Supervisor/ChatBot/Tests/browser_ui.js
        env:
          IATB_PLAYWRIGHT_MODULE: /tmp/iatb-browser/node_modules/playwright
          IATB_UI_REPORT_DIR: /tmp/iatb-chatbot-ui-report
      - run: python3 Tools/Build/build_risk_snapshot.py
      - run: python3 Tools/Build/verify_source_bundle.py artifacts/IA-TB-2.6.0-dev.5-debug-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IA-TB-2.6.0-dev.5-DEBUG-source-validation-captures
          path: |
            artifacts/IA-TB-2.6.0-dev.5-debug-source.zip*
            /tmp/iatb-chatbot-validation/*.json
            /tmp/iatb-chatbot-validation/*.tap
            /tmp/iatb-chatbot-validation/stderr.log
            /tmp/iatb-chatbot-ui-report/*
