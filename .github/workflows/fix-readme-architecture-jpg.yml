name: Fix README architecture JPG

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-readme-architecture-jpg.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Point README to JPG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('src="./docs/assets/app_architecture.svg"','src="./docs/assets/app_architecture.jpg"',1)
          if 'src="./docs/assets/app_architecture.jpg"' not in s:
              raise SystemExit('README image marker not found')
          p.write_text(s,encoding='utf-8')
          PY
          grep -F 'src="./docs/assets/app_architecture.jpg"' README.md
      - name: Commit and cleanup
        run: |
          rm -f .github/workflows/fix-readme-architecture-jpg.yml
          git config user.name 'IA-TB Asset Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md .github/workflows/fix-readme-architecture-jpg.yml
          git commit -m 'docs: use JPG architecture image in README'
          git push origin HEAD:main
