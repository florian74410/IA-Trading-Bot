name: Risk parallel snapshots DEBUG
on:
  push:
    branches: ['feature/risk-engine-parallel-snapshots']
  pull_request:
    paths: ['App/Engines/Risk/**', 'App/Engines/Portfolio/**', 'App/Engines/Trading/**', 'App/Core/Clients/UserManagement/**', 'App/Frontend/JS/portfolio_okx_account.js', 'App/Engines/Supervisor/Core/**', 'App/Core/Communication/**', 'App/Engines/Firewall/risk_approval_client.js', 'App/Core/Shared/build_info.js', 'Tools/Build/**']
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev --no-audit --no-fund
        working-directory: App
      - run: node App/Tools_validate_release_version.js
      - run: node --test --test-concurrency=1 App/Engines/Risk/Tests/snapshots.test.js App/Engines/Risk/Tests/snapshots.integration.test.js App/Engines/Risk/Tests/risk_engine.test.js App/Engines/Risk/Tests/test_risk_gate.js App/Engines/Risk/Tests/test_risk_r1_r2_v25.js App/Engines/Risk/Tests/test_risk_settings_v25.js App/Engines/Supervisor/Tests/test_supervisor_architecture.js App/Engines/Supervisor/LLM/Tests/test_llm_manager.js App/Core/Communication/Tests/test_communication_router_v1.js App/Core/Communication/Tests/test_router_normalization_v1.8.12.js App/tests/function-registry-discovery.test.js App/Engines/Portfolio/Tests/okx_account.test.js App/Engines/Portfolio/Tests/okx_pipeline.integration.test.js App/Engines/Trading/tests/test_account_routing_v253.js App/Tools/Tests/user_management_trading_vault.test.js App/Tools/Tests/user_management_owner_engines.test.js App/Tools/Tests/user_management_route_matrix.test.js App/Tools/Tests/user_management_market_pipeline.test.js App/Engines/Trading/tests/test_trading_core_v2.0.js App/Engines/Firewall/Tests/trading_firewall.test.js
        env:
          IATB_RUNTIME_ROOT: /tmp/iatb-risk-runtime
          IATB_DATA_ROOT: /tmp/iatb-risk-data
      - run: node App/Engines/Risk/Tests/benchmark_snapshots.js /tmp/benchmark.json
      - run: python3 Tools/Build/build_risk_snapshot.py
      - uses: actions/upload-artifact@v4
        with:
          name: risk-snapshots-debug-source
          path: |
            artifacts/IA-TB-*-debug-source.zip*
            /tmp/benchmark.json
