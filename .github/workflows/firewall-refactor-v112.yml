name: IA-TB v1.12 Firewall Refactor

on:
  push:
    branches: [debug]

permissions:
  contents: write

jobs:
  refactor:
    if: github.event.head_commit.message == 'chore(debug): stage firewall v1.12 refactor workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug
          fetch-depth: 0
      - name: Refactor Firewall and add bypass mode
        shell: bash
        run: |
          set -euo pipefail
          B="builds/IA-TB_Build_v1.12_DEBUG"

          mkdir -p "$B/Core/Firewall/Protection" "$B/Core/Firewall/Workers" "$B/Core/Firewall/Config/Trading" "$B/Core/Firewall/Config/MarketData" "$B/Core/Firewall/Tests"

          git mv "$B/Core/TradingFirewall/trading_firewall.js" "$B/Core/Firewall/Protection/trading_firewall.js"
          git mv "$B/Core/TradingFirewall/test_v1.8.7.js" "$B/Core/Firewall/Tests/trading_firewall.test.js"
          git mv "$B/Core/DataCollectorFirewall/data_collector_firewall.js" "$B/Core/Firewall/Protection/market_data_firewall.js"
          git mv "$B/Core/Firewall/protection_worker.js" "$B/Core/Firewall/Workers/protection_worker.js"
          git mv "$B/Core/Firewall/Trading_Engine_security/rules.json" "$B/Core/Firewall/Config/Trading/rules.json"
          git mv "$B/Core/Firewall/Trading_Engine_security/whitelist.json" "$B/Core/Firewall/Config/Trading/whitelist.json"
          git mv "$B/Core/Firewall/Market_Data_Collector_security/rules.json" "$B/Core/Firewall/Config/MarketData/rules.json"
          git mv "$B/Core/Firewall/Market_Data_Collector_security/whitelist.json" "$B/Core/Firewall/Config/MarketData/whitelist.json"

          python3 <<'PY'
          from pathlib import Path
          B=Path('builds/IA-TB_Build_v1.12_DEBUG')

          def rep(path, old, new):
              p=B/path
              s=p.read_text()
              if old not in s:
                  raise SystemExit('missing replacement in %s: %r' % (p, old[:100]))
              p.write_text(s.replace(old,new))

          # Worker paths after canonical Firewall consolidation.
          p=B/'Core/Firewall/Workers/protection_worker.js'
          s=p.read_text()
          s=s.replace("var parent=wt.parentPort,data=wt.workerData||{},ROOT=path.resolve(__dirname,'../..');", "var parent=wt.parentPort,data=wt.workerData||{};")
          s=s.replace("var dir=path.join(__dirname,data.securityDir)", "var dir=path.resolve(__dirname,'../Config',data.configDir)")
          s=s.replace("require('../TradingFirewall/trading_firewall')", "require('../Protection/trading_firewall')")
          s=s.replace("require('../DataCollectorFirewall/data_collector_firewall')", "require('../Protection/market_data_firewall')")
          p.write_text(s)

          # Service now points only inside Core/Firewall and identifies thread 0 correctly.
          p=B/'Core/Firewall/firewall_service.js'
          s=p.read_text()
          s=s.replace("Thread 0 Router Firewall (main thread), Thread 1 Trading protection,\n   Thread 2 Market Data protection.", "Thread 0 Firewall Coordinator (main thread), Thread 1 Trading protection,\n   Thread 2 Market Data protection.")
          s=s.replace("THREAD_SPECS={trading:{id:'trading',thread:1,kind:'trading',name:'Trading Engine Protection',securityDir:'Trading_Engine_security'},data:{id:'data',thread:2,kind:'data',name:'Market Data Collector Protection',securityDir:'Market_Data_Collector_security'}}", "THREAD_SPECS={trading:{id:'trading',thread:1,kind:'trading',name:'Trading Engine Protection',configDir:'Trading'},data:{id:'data',thread:2,kind:'data',name:'Market Data Collector Protection',configDir:'MarketData'}}")
          s=s.replace("function worker(id,thread,kind,name,securityDir,onReady){var w=new Worker(path.join(__dirname,'protection_worker.js'),{workerData:{id:id,thread:thread,kind:kind,name:name,securityDir:securityDir}})", "function worker(id,thread,kind,name,configDir,onReady){var w=new Worker(path.join(__dirname,'Workers','protection_worker.js'),{workerData:{id:id,thread:thread,kind:kind,name:name,configDir:configDir}})")
          s=s.replace("worker(spec.id,spec.thread,spec.kind,spec.name,spec.securityDir,cb)", "worker(spec.id,spec.thread,spec.kind,spec.name,spec.configDir,cb)")
          s=s.replace("threads:[{thread:0,id:'router',name:'Router Firewall',online:true,enabled:true,status:'ONLINE'},threadView('trading'),threadView('data')],securityFolders:['Core/Firewall/Trading_Engine_security','Core/Firewall/Market_Data_Collector_security']", "workerCount:2,coordinator:true,threads:[{thread:0,id:'coordinator',name:'Firewall Coordinator',kind:'coordinator',type:'COORDINATOR',online:true,enabled:true,status:'ONLINE'},threadView('trading'),threadView('data')],securityFolders:['Core/Firewall/Config/Trading','Core/Firewall/Config/MarketData']")
          s=s.replace("Thread 0 Router | Thread 1 Trading | Thread 2 Data", "Thread 0 Coordinator | Thread 1 Trading | Thread 2 Data")
          p.write_text(s)

          # Trading test path after move.
          p=B/'Core/Firewall/Tests/trading_firewall.test.js'
          s=p.read_text().replace("require('./trading_firewall')", "require('../Protection/trading_firewall')")
          p.write_text(s)

          # Market Data firewall: implement price-jump, bid/ask and spread rules that were previously declared only.
          p=B/'Core/Firewall/Protection/market_data_firewall.js'
          s=p.read_text()
          marker="DataCollectorFirewall.prototype.inspect=function(message){"
          if marker not in s:
              raise SystemExit('market firewall inspect marker missing')
          before=s.split(marker,1)[0]
          tail="""DataCollectorFirewall.prototype._priceFromMessage=function(msg,type){var d=msg&&msg.data,rows;if(msg&&isFinite(+msg.price)&&+msg.price>0)return +msg.price;if(d&&typeof d==='object'&&!Array.isArray(d)&&isFinite(+d.price)&&+d.price>0)return +d.price;if(['OHLC','OHLCV','CANDLES'].indexOf(type)>=0){rows=Array.isArray(d)?d:(d&&Array.isArray(d.candles)?d.candles:[]);if(rows.length){var c=rows[rows.length-1],v=Array.isArray(c)?+c[4]:c&&+c.close;if(isFinite(v)&&v>0)return v;}}return null;};
DataCollectorFirewall.prototype._bidAsk=function(msg){var d=msg&&msg.data&&typeof msg.data==='object'&&!Array.isArray(msg.data)?msg.data:{},bid=msg&&msg.bid!=null?+msg.bid:(d.bid!=null?+d.bid:null),ask=msg&&msg.ask!=null?+msg.ask:(d.ask!=null?+d.ask:null);return{present:bid!=null||ask!=null,bid:bid,ask:ask};};
DataCollectorFirewall.prototype._checkPriceJump=function(provider,symbol,price,issues){if(!this.rules.priceJump||!isFinite(price)||price<=0)return;var key=provider+'|'+norm(symbol),prev=this.lastPrice.get(key);if(isFinite(prev)&&prev>0){var pct=Math.abs(price-prev)/prev*100;if(pct>this.maxPriceJumpPct){issues.push({code:'PRICE_JUMP_EXCEEDED',previous:prev,current:price,jumpPct:pct,maxPriceJumpPct:this.maxPriceJumpPct});return;}}this.lastPrice.set(key,price);};
DataCollectorFirewall.prototype.inspect=function(message){var t=Date.now(),msg=message&&typeof message==='object'?message:{},issues=[],warnings=[];this.stats.received++;if(!this.enabled)return this._finish('PASS','FIREWALL_DISABLED',msg,issues,warnings,t);if(this.rules.payloadSize&&Buffer.byteLength(JSON.stringify(msg),'utf8')>this.maxPayloadBytes)issues.push({code:'PAYLOAD_TOO_LARGE'});var provider=norm(msg.provider||msg.source),type=norm(msg.type||msg.dataType);if(this.rules.providerWhitelist&&(!provider||!this.providerWhitelist.has(provider)))issues.push({code:provider?'PROVIDER_NOT_ALLOWED':'PROVIDER_MISSING',provider:provider});if(this.rules.typeWhitelist&&(!type||!this.typeWhitelist.has(type)))issues.push({code:type?'DATA_TYPE_NOT_ALLOWED':'DATA_TYPE_MISSING',type:type});if(this.rules.provenance&&this.requireProvenance&&!(msg.provenance||msg.source||msg.provider))issues.push({code:'PROVENANCE_MISSING'});if(this.rules.timestamp){var ts=Number(msg.timestamp||msg.updatedAt||msg.receivedAt),age=t-ts;if(!isFinite(ts))issues.push({code:'TIMESTAMP_MISSING_OR_INVALID'});else{if(age>this.maxMessageAgeMs)issues.push({code:'STALE_DATA',ageMs:age});if(age< -this.maxFutureSkewMs)issues.push({code:'FUTURE_TIMESTAMP',skewMs:-age});}}if(this.rules.symbol&&msg.symbol&&!/^[A-Za-z0-9:_\\-\\/\\.]{2,40}$/.test(String(msg.symbol)))issues.push({code:'INVALID_SYMBOL'});if(this.rules.ohlcSchema&&['OHLC','OHLCV','CANDLES'].indexOf(type)>=0){var rows=Array.isArray(msg.data)?msg.data:(msg.data&&Array.isArray(msg.data.candles)?msg.data.candles:[]);if(!rows.length)issues.push({code:'CANDLES_EMPTY'});else rows.slice(0,2000).forEach(function(c,i){this._candle(c,issues,'data['+i+']');},this);}var ba=this._bidAsk(msg);if(this.rules.bidAsk&&ba.present){if(!isFinite(ba.bid)||!isFinite(ba.ask)||ba.bid<=0||ba.ask<=0)issues.push({code:'BID_ASK_INVALID',bid:ba.bid,ask:ba.ask});else if(ba.ask<ba.bid)issues.push({code:'BID_ASK_INVERTED',bid:ba.bid,ask:ba.ask});}if(this.rules.spread&&ba.present&&isFinite(ba.bid)&&isFinite(ba.ask)&&ba.bid>0&&ba.ask>=ba.bid){var mid=(ba.ask+ba.bid)/2,spread=mid>0?(ba.ask-ba.bid)/mid*100:Infinity;if(spread>this.maxSpreadPct)issues.push({code:'SPREAD_EXCEEDED',spreadPct:spread,maxSpreadPct:this.maxSpreadPct,bid:ba.bid,ask:ba.ask});}var currentPrice=this._priceFromMessage(msg,type);this._checkPriceJump(provider,msg.symbol||'',currentPrice,issues);if(this.rules.duplicateProtection&&this.duplicateWindowMs>0){var fp=crypto.createHash('sha256').update(JSON.stringify({provider:msg.provider,source:msg.source,type:msg.type,symbol:msg.symbol,timeframe:msg.timeframe,timestamp:msg.timestamp,data:msg.data,bid:msg.bid,ask:msg.ask,price:msg.price})).digest('hex'),prevSeen=this.seen.get(fp);if(prevSeen&&t-prevSeen<=this.duplicateWindowMs){warnings.push({code:'DUPLICATE_DATA',ageMs:t-prevSeen});this.stats.duplicates++;}this.seen.set(fp,t);var self=this;this.seen.forEach(function(v,k){if(t-v>self.duplicateWindowMs)self.seen.delete(k);});}if(issues.length)return this._finish(this.mode==='OBSERVATION'?'WARN':'REJECT',this.mode==='OBSERVATION'?'WOULD_REJECT':'VALIDATION_FAILED',msg,issues,warnings,t);return this._finish(warnings.length?'WARN':'PASS',warnings.length?'ANOMALY_WARNING':'VALID',msg,issues,warnings,t);};
DataCollectorFirewall.DEFAULT_RULES=DEFAULT_RULES;module.exports=DataCollectorFirewall;
"""
          p.write_text(before+tail)

          # Add tests for the newly-real protections.
          (B/'Core/Firewall/Tests/market_data_firewall.test.js').write_text("""'use strict';
var assert=require('assert'),DF=require('../Protection/market_data_firewall');
function base(extra){return Object.assign({provider:'KRAKEN_PUBLIC_REFERENCE',source:'KRAKEN_PUBLIC_REFERENCE',provenance:'KRAKEN_PUBLIC_REFERENCE',type:'PRICE',symbol:'BTC/EUR',timestamp:Date.now(),price:100},extra||{});}
var fw=new DF({maxPriceJumpPct:20,maxSpreadPct:10,duplicateWindowMs:0});
assert.equal(fw.inspect(base()).decision,'PASS');
var jump=fw.inspect(base({price:150,timestamp:Date.now()+1}));assert.equal(jump.decision,'REJECT');assert(jump.issues.some(function(x){return x.code==='PRICE_JUMP_EXCEEDED';}));
var ba=new DF({maxPriceJumpPct:1000,maxSpreadPct:2,duplicateWindowMs:0});
var spread=ba.inspect(base({price:100,bid:95,ask:105}));assert.equal(spread.decision,'REJECT');assert(spread.issues.some(function(x){return x.code==='SPREAD_EXCEEDED';}));
var inv=new DF({maxPriceJumpPct:1000,maxSpreadPct:100,duplicateWindowMs:0});
var inverted=inv.inspect(base({bid:101,ask:99}));assert.equal(inverted.decision,'REJECT');assert(inverted.issues.some(function(x){return x.code==='BID_ASK_INVERTED';}));
var obs=new DF({mode:'OBSERVATION',maxPriceJumpPct:1,duplicateWindowMs:0});obs.inspect(base({price:100}));var warn=obs.inspect(base({price:120,timestamp:Date.now()+1}));assert.equal(warn.decision,'WARN');
console.log('PASS Market Data Firewall price jump + bid/ask + spread');
""")

          # Router HTTP proxy can bypass Data Firewall when explicitly disabled.
          p=B/'Core/Router/router.js'
          s=p.read_text()
          s=s.replace("var MARKET_DATA_HOST='127.0.0.1',MARKET_DATA_PORT=+(process.env.IATB_MARKET_DATA_PORT||8013),FIREWALL_PORT=+(process.env.IATB_FIREWALL_PORT||process.env.IATB_TRADING_FIREWALL_PORT||8017);", "var MARKET_DATA_HOST='127.0.0.1',MARKET_DATA_PORT=+(process.env.IATB_MARKET_DATA_PORT||8013),FIREWALL_PORT=+(process.env.IATB_FIREWALL_PORT||process.env.IATB_TRADING_FIREWALL_PORT||8017),FIREWALL_ENABLED=!/^(0|false|off|no)$/i.test(String(process.env.IATB_FIREWALL_ENABLED||'1'));" )
          old="if(p==='/market-data'||p.indexOf('/market-data/')===0){var msub=p.slice('/market-data'.length)||'/';return proxy(req,res,MARKET_DATA_HOST,FIREWALL_PORT,msub+u.search,{label:'Firewall Data Thread'});}"
          new="if(p==='/market-data'||p.indexOf('/market-data/')===0){var msub=p.slice('/market-data'.length)||'/',mport=FIREWALL_ENABLED?FIREWALL_PORT:MARKET_DATA_PORT,mlabel=FIREWALL_ENABLED?'Firewall Data Thread':'Market Data Direct (Firewall OFF)';return proxy(req,res,MARKET_DATA_HOST,mport,msub+u.search,{label:mlabel});}"
          if old not in s: raise SystemExit('router market firewall route marker missing')
          p.write_text(s.replace(old,new))

          # CP/1 communication registry routes Trading directly to :8016 in Firewall OFF mode.
          p=B/'Core/Communication/communication_router_v1.js'
          s=p.read_text()
          old="opt=opt||{};this.root=path.resolve(root);this.protocol=CP.PROTOCOL;this.host='127.0.0.1';"
          new="opt=opt||{};this.root=path.resolve(root);this.protocol=CP.PROTOCOL;this.host='127.0.0.1';this.firewallEnabled=!/^(0|false|off|no)$/i.test(String(process.env.IATB_FIREWALL_ENABLED||'1'));"
          if old not in s: raise SystemExit('communication router constructor marker missing')
          s=s.replace(old,new)
          old="self.registry[entry.id]={id:entry.id,label:entry.label,type:entry.type,host:entry.endpoint.host||'127.0.0.1',port:+entry.endpoint.port,cpPath:entry.endpoint.cpPath||'/cp/v1',healthPath:entry.endpoint.healthPath||'/health',capabilities:cpCommands,events:events,registeredAt:0,lastSeen:0,dynamic:false};"
          new="var endpointPort=(entry.id==='trading'&&!self.firewallEnabled)?+(process.env.IATB_TRADING_ENGINE_PORT||8016):+entry.endpoint.port;self.registry[entry.id]={id:entry.id,label:entry.label,type:entry.type,host:entry.endpoint.host||'127.0.0.1',port:endpointPort,cpPath:entry.endpoint.cpPath||'/cp/v1',healthPath:entry.endpoint.healthPath||'/health',capabilities:cpCommands,events:events,registeredAt:0,lastSeen:0,dynamic:false};"
          if old not in s: raise SystemExit('communication router registry marker missing')
          p.write_text(s.replace(old,new))

          # Trading Engine keeps CP/1 + risk approval, but drops only the Firewall-forward proof when OFF.
          p=B/'services/trading-engine/trading_service.js'
          s=p.read_text()
          old="var LIVE=String(process.env.IATB_TRADING_LIVE||'0')==='1',SERVICE_ENABLED=String(process.env.IATB_TRADING_ENGINE_ENABLED||'1')!=='0',ROOT=path.resolve(__dirname,'../..');"
          new="var LIVE=String(process.env.IATB_TRADING_LIVE||'0')==='1',SERVICE_ENABLED=String(process.env.IATB_TRADING_ENGINE_ENABLED||'1')!=='0',FIREWALL_ENABLED=!/^(0|false|off|no)$/i.test(String(process.env.IATB_FIREWALL_ENABLED||'1')),ROOT=path.resolve(__dirname,'../..');"
          if old not in s: raise SystemExit('trading env marker missing')
          s=s.replace(old,new)
          s=s.replace("firewallForwardRequired:true,portfolioFeed:true", "firewallForwardRequired:FIREWALL_ENABLED,firewallEnabled:FIREWALL_ENABLED,firewallBypass:!FIREWALL_ENABLED,portfolioFeed:true")
          s=s.replace("if(mutating(v.action)&&!firewallForwardOK(req,raw))return send(res,403,cpResponse(msg,'ERROR',{error:'FIREWALL_FORWARD_REQUIRED'}));", "if(mutating(v.action)&&FIREWALL_ENABLED&&!firewallForwardOK(req,raw))return send(res,403,cpResponse(msg,'ERROR',{error:'FIREWALL_FORWARD_REQUIRED'}));")
          s=s.replace("console.log('Execution LIVE: '+(LIVE?'ENABLED':'DISABLED')+' · Firewall forward required');", "console.log('Execution LIVE: '+(LIVE?'ENABLED':'DISABLED')+' · Firewall: '+(FIREWALL_ENABLED?'ENABLED / forward required':'DISABLED / direct CP1 test mode'));")
          p.write_text(s)

          # start.command: Firewall ON by default; explicit OFF skips process + health gate and propagates direct-routing mode.
          p=B/'start.command'
          s=p.read_text()
          s=s.replace("FIREWALL_PORT=8017\nSTRATEGY_PORT=8018", "FIREWALL_PORT=8017\nFIREWALL_ENABLED_RAW=\"${IATB_FIREWALL_ENABLED:-1}\"\ncase \"$(printf '%s' \"$FIREWALL_ENABLED_RAW\" | tr '[:upper:]' '[:lower:]')\" in 0|false|off|no) FIREWALL_ENABLED=0 ;; *) FIREWALL_ENABLED=1 ;; esac\nexport IATB_FIREWALL_ENABLED=\"$FIREWALL_ENABLED\"\nSTRATEGY_PORT=8018")
          s=s.replace(": > Core/Firewall/Firewall.log", "if [ \"$FIREWALL_ENABLED\" = \"1\" ]; then : > Core/Firewall/Firewall.log; fi")
          s=s.replace("echo \"Firewall         : 127.0.0.1:$FIREWALL_PORT (Thread 0 Router · Thread 1 Trading · Thread 2 Data)\"", "if [ \"$FIREWALL_ENABLED\" = \"1\" ]; then echo \"Firewall         : 127.0.0.1:$FIREWALL_PORT (Coordinator · Trading · Data)\"; else echo \"Firewall         : DESACTIVE — mode test direct\"; fi")
          old="IATB_TRADING_ENGINE_PORT=\"$TRADING_ENGINE_PORT\" ROUTER_PORT=\"$ROUTER_PORT\" IATB_TRADING_LIVE=\"0\" \"$NODE_BIN\" services/trading-engine/trading_service.js >> services/trading-engine/trading.log 2>&1 &"
          new="IATB_FIREWALL_ENABLED=\"$FIREWALL_ENABLED\" IATB_TRADING_ENGINE_PORT=\"$TRADING_ENGINE_PORT\" ROUTER_PORT=\"$ROUTER_PORT\" IATB_TRADING_LIVE=\"0\" \"$NODE_BIN\" services/trading-engine/trading_service.js >> services/trading-engine/trading.log 2>&1 &"
          if old not in s: raise SystemExit('start trading launch marker missing')
          s=s.replace(old,new)
          old="IATB_FIREWALL_PORT=\"$FIREWALL_PORT\" IATB_TRADING_FIREWALL_PORT=\"$FIREWALL_PORT\" IATB_TRADING_ENGINE_PORT=\"$TRADING_ENGINE_PORT\" IATB_MARKET_DATA_PORT=\"$MARKET_DATA_PORT\" \"$NODE_BIN\" Core/Firewall/firewall_service.js >> Core/Firewall/Firewall.log 2>&1 &\nFIREWALL_PID=$!"
          new="if [ \"$FIREWALL_ENABLED\" = \"1\" ]; then\n  IATB_FIREWALL_PORT=\"$FIREWALL_PORT\" IATB_TRADING_FIREWALL_PORT=\"$FIREWALL_PORT\" IATB_TRADING_ENGINE_PORT=\"$TRADING_ENGINE_PORT\" IATB_MARKET_DATA_PORT=\"$MARKET_DATA_PORT\" \"$NODE_BIN\" Core/Firewall/firewall_service.js >> Core/Firewall/Firewall.log 2>&1 &\n  FIREWALL_PID=$!\nelse\n  FIREWALL_PID=\"\"\n  echo \"ATTENTION: Firewall non initialise. Trading/MarketData utilisent le chemin direct de test.\"\nfi"
          if old not in s: raise SystemExit('start firewall launch marker missing')
          s=s.replace(old,new)
          # Wrap existing Firewall readiness block, leaving exact checks unchanged inside.
          start="# Attendre que le Firewall Service et ses deux threads de protection soient démarrés.\nfw_ok=0"
          if start not in s: raise SystemExit('firewall readiness start marker missing')
          s=s.replace(start, "# Attendre le Firewall uniquement lorsqu'il est active.\nif [ \"$FIREWALL_ENABLED\" = \"1\" ]; then\nfw_ok=0",1)
          end="  cleanup; read -p \"Appuie sur Entree pour fermer...\"; exit 1\nfi\n\n# L Indicator Engine"
          if end not in s: raise SystemExit('firewall readiness end marker missing')
          s=s.replace(end, "  cleanup; read -p \"Appuie sur Entree pour fermer...\"; exit 1\nfi\nfi\n\n# L Indicator Engine",1)
          s=s.replace("IATB_PUBLIC_PORT=\"$CORE_PORT\" IATB_UI_SEPARATED=\"1\" ROUTER_PORT=\"$ROUTER_PORT\"", "IATB_FIREWALL_ENABLED=\"$FIREWALL_ENABLED\" IATB_PUBLIC_PORT=\"$CORE_PORT\" IATB_UI_SEPARATED=\"1\" ROUTER_PORT=\"$ROUTER_PORT\"")
          s=s.replace("CORE_PUBLIC_PORT=\"$CORE_PORT\" KRAKEN_ADDON_PORT=\"$KRAKEN_PORT\"", "IATB_FIREWALL_ENABLED=\"$FIREWALL_ENABLED\" CORE_PUBLIC_PORT=\"$CORE_PORT\" KRAKEN_ADDON_PORT=\"$KRAKEN_PORT\"")
          p.write_text(s)

          # macOS-friendly double-click launcher for explicit test mode without Firewall.
          p=B/'start_no_firewall.command'
          p.write_text("""#!/bin/bash
cd \"$(dirname \"$0\")\" || exit 1
echo \"============================================================\"
echo \" IA-TB — MODE TEST SANS FIREWALL\"
echo \" Trading et Market Data passent directement par le Router.\"
echo \" CP/1 et Risk Approval restent actifs.\"
echo \"============================================================\"
IATB_FIREWALL_ENABLED=0 exec /bin/bash ./start.command
""")

          # README reflects real architecture and optional initialization.
          (B/'Core/Firewall/README.md').write_text("""# IA-TB Firewall

Architecture v1.12 : **1 service / 1 port (8017) / 1 coordinateur + 2 Workers de protection**.

- Thread 0 — Firewall Coordinator : orchestration HTTP, proxy interne et cycle de vie des Workers.
- Thread 1 — Trading Protection : `Protection/trading_firewall.js`, configuration `Config/Trading/`.
- Thread 2 — Market Data Protection : `Protection/market_data_firewall.js`, configuration `Config/MarketData/`.

## Initialisation optionnelle

Le Firewall est **active par defaut**. `./start.command` demarre donc le service et exige son health-check.

Pour les tests et le developpement, `./start_no_firewall.command` (ou `IATB_FIREWALL_ENABLED=0 ./start.command`) n'initialise pas le service Firewall. Le Router envoie alors Market Data directement vers le Market Data Collector et CP/1 route Trading directement vers le Trading Engine. Le Trading Engine conserve l'authentification CP/1, la validation des arguments et l'exigence `risk_approval_id`; seule la preuve de transfert par Firewall est ignoree dans ce mode explicite.

Ce mode est destine au diagnostic et au developpement. Le mode normal/prod doit conserver le Firewall actif.

## Protections Market Data

Les regles `priceJump`, `bidAsk` et `spread` sont effectives : saut de prix maximum, coherence bid/ask et spread maximum sont controles lorsqu'une donnee compatible est presente.

Les evenements du service sont centralises dans `Core/Firewall/Firewall.log`.
""")
          PY

          chmod +x "$B/start_no_firewall.command"

          # Static validation + focused regression tests.
          node --check "$B/Core/Firewall/firewall_service.js"
          node --check "$B/Core/Firewall/Workers/protection_worker.js"
          node --check "$B/Core/Firewall/Protection/trading_firewall.js"
          node --check "$B/Core/Firewall/Protection/market_data_firewall.js"
          node --check "$B/Core/Router/router.js"
          node --check "$B/Core/Communication/communication_router_v1.js"
          node --check "$B/services/trading-engine/trading_service.js"
          bash -n "$B/start.command"
          bash -n "$B/start_no_firewall.command"
          node "$B/Core/Firewall/Tests/trading_firewall.test.js"
          node "$B/Core/Firewall/Tests/market_data_firewall.test.js"

