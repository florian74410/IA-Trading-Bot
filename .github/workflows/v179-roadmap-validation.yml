name: v1.7.9 Roadmap Validation

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v179-roadmap-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  roadmap-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'

      - name: Prepare report
        run: |
          : > v179-roadmap-test-report.txt
          echo 'IA-TB v1.7.9 ROADMAP VALIDATION' | tee -a v179-roadmap-test-report.txt
          echo "Commit: $GITHUB_SHA" | tee -a v179-roadmap-test-report.txt
          echo "Node: $(node --version)" | tee -a v179-roadmap-test-report.txt
          echo "Runner: $(uname -a)" | tee -a v179-roadmap-test-report.txt

      - name: Validate build identity and roadmap components
        id: integrity
        continue-on-error: true
        run: |
          set +e
          fail=0
          report=v179-roadmap-test-report.txt
          check(){
            if eval "$2"; then echo "[PASS] $1" | tee -a "$report"; else echo "[FAIL] $1" | tee -a "$report"; fail=1; fi
          }
          check 'build directory exists' "test -d builds/v1.7.9"
          check 'VERSION is 1.7.9' "test \"$(tr -d '\r\n' < builds/v1.7.9/VERSION)\" = '1.7.9'"
          check 'manifest version is 1.7.9' "node -e \"const m=require('./builds/v1.7.9/manifest.json');process.exit(m.version==='1.7.9'?0:1)\""
          check 'MarketData package version is 1.7.9' "node -e \"const p=require('./builds/v1.7.9/MarketData/package.json');process.exit(p.version==='1.7.9'?0:1)\""
          check 'CoinGecko provider present' "grep -R -q 'COINGECKO' builds/v1.7.9/MarketData"
          check 'Blockchain.com provider present' "grep -R -q 'BLOCKCHAIN' builds/v1.7.9/MarketData"
          check 'DefiLlama provider present' "grep -R -q 'DEFILLAMA' builds/v1.7.9/MarketData"
          check 'price consensus endpoint present' "grep -R -q '/price/consensus' builds/v1.7.9"
          check 'candle consensus endpoint present' "grep -R -q '/candles/consensus' builds/v1.7.9"
          check 'FX proxy endpoint present' "grep -R -q '/api/market/fx-klines' builds/v1.7.9"
          check 'capabilities endpoint present' "grep -R -q '/capabilities' builds/v1.7.9/MarketData"
          check 'FX consensus test present' "find builds/v1.7.9 -type f -name 'test_fx_consensus_v1.7.9.js' | grep -q ."
          exit $fail

      - name: Install Market Data runtime dependency
        id: deps
        continue-on-error: true
        run: |
          cd builds/v1.7.9/MarketData
          npm install --ignore-scripts --no-audit --no-fund

      - name: JavaScript syntax validation
        id: syntax
        continue-on-error: true
        run: |
          set +e
          report=v179-roadmap-test-report.txt
          fail=0
          count=0
          while IFS= read -r f; do
            count=$((count+1))
            node --check "$f" >/tmp/jscheck.out 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then
              echo "[FAIL] syntax $f" | tee -a "$report"
              cat /tmp/jscheck.out | tee -a "$report"
              fail=1
            fi
          done < <(find builds/v1.7.9 -type f -name '*.js' ! -path '*/node_modules/*' | sort)
          if [ $fail -eq 0 ]; then echo "[PASS] JavaScript syntax: $count files" | tee -a "$report"; fi
          exit $fail

      - name: Run v1.7.9 self-test
        id: selftest
        continue-on-error: true
        run: |
          set +e
          timeout 60s node builds/v1.7.9/UserData/self_test.js 2>&1 | tee -a v179-roadmap-test-report.txt
          rc=${PIPESTATUS[0]}
          if [ $rc -eq 0 ]; then echo '[PASS] UserData self-test' | tee -a v179-roadmap-test-report.txt; else echo "[FAIL] UserData self-test rc=$rc" | tee -a v179-roadmap-test-report.txt; fi
          exit $rc

      - name: Run all discovered JavaScript tests
        id: tests
        continue-on-error: true
        run: |
          set +e
          report=v179-roadmap-test-report.txt
          fail=0
          count=0
          passed=0
          failed=0
          while IFS= read -r f; do
            count=$((count+1))
            echo "=== TEST $f ===" | tee -a "$report"
            timeout 60s node "$f" >>"$report" 2>&1
            rc=$?
            if [ $rc -eq 0 ]; then
              passed=$((passed+1)); echo "[PASS] $f" | tee -a "$report"
            else
              failed=$((failed+1)); fail=1; echo "[FAIL] $f rc=$rc" | tee -a "$report"
            fi
          done < <(find builds/v1.7.9 -type f \( -name 'test_*.js' -o -name '*_test.js' \) ! -path '*/node_modules/*' | sort)
          echo "TEST SUMMARY total=$count pass=$passed fail=$failed" | tee -a "$report"
          exit $fail

      - name: Public network smoke checks
        id: network
        continue-on-error: true
        run: |
          set +e
          report=v179-roadmap-test-report.txt
          fail=0
          net(){
            name="$1"; url="$2"
            if curl -fsSL --connect-timeout 8 --max-time 15 "$url" >/tmp/net.out; then
              echo "[PASS] network $name" | tee -a "$report"
            else
              echo "[FAIL] network $name" | tee -a "$report"; fail=1
            fi
          }
          net 'Kraken public API' 'https://api.kraken.com/0/public/Time'
          net 'CoinGecko public API' 'https://api.coingecko.com/api/v3/ping'
          net 'DefiLlama public API' 'https://api.llama.fi/protocols'
          net 'GMX oracle endpoint' 'https://arbitrum-api.gmxinfra.io/prices/tickers'
          exit $fail

      - name: Market Data service smoke and memory sample
        id: memory
        continue-on-error: true
        run: |
          set +e
          report=v179-roadmap-test-report.txt
          node builds/v1.7.9/MarketData/market_data_service.js >/tmp/marketdata.log 2>&1 &
          pid=$!
          sleep 5
          if kill -0 "$pid" 2>/dev/null; then
            rss=$(ps -o rss= -p "$pid" | tr -d ' ')
            echo "[PASS] MarketData process alive; RSS_KB=$rss" | tee -a "$report"
            curl -fsS --max-time 5 http://127.0.0.1:8013/health >/tmp/health.json 2>/dev/null
            if [ $? -eq 0 ]; then echo '[PASS] MarketData /health' | tee -a "$report"; else echo '[FAIL] MarketData /health' | tee -a "$report"; fi
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            exit 0
          else
            echo '[FAIL] MarketData process did not stay alive' | tee -a "$report"
            cat /tmp/marketdata.log | tee -a "$report"
            exit 1
          fi

      - name: Validate existing v1.7.9 patch archive
        id: patch
        continue-on-error: true
        run: |
          set +e
          report=v179-roadmap-test-report.txt
          zipfile='updates/v1.7.9/Crypto Chart Viewer IA Trader.zip'
          if [ ! -f "$zipfile" ]; then echo '[FAIL] v1.7.9 patch archive missing' | tee -a "$report"; exit 1; fi
          unzip -tq "$zipfile" >>"$report" 2>&1
          rc=$?
          if [ $rc -eq 0 ]; then echo '[PASS] v1.7.9 patch ZIP integrity' | tee -a "$report"; else echo '[FAIL] v1.7.9 patch ZIP integrity' | tee -a "$report"; fi
          exit $rc

      - name: Existing v1.7.8 to v1.7.9 install test
        id: install
        continue-on-error: true
        run: |
          set +e
          chmod +x updates/v1.7.9/test_install.command 2>/dev/null
          timeout 120s updates/v1.7.9/test_install.command 2>&1 | tee -a v179-roadmap-test-report.txt
          rc=${PIPESTATUS[0]}
          if [ $rc -eq 0 ]; then echo '[PASS] UpdateManager installation test' | tee -a v179-roadmap-test-report.txt; else echo "[FAIL] UpdateManager installation test rc=$rc" | tee -a v179-roadmap-test-report.txt; fi
          exit $rc

      - name: Final validation status
        run: |
          echo '' | tee -a v179-roadmap-test-report.txt
          echo 'STEP OUTCOMES' | tee -a v179-roadmap-test-report.txt
          echo "integrity=${{ steps.integrity.outcome }}" | tee -a v179-roadmap-test-report.txt
          echo "dependencies=${{ steps.deps.outcome }}" | tee -a v179-roadmap-test-report.txt
          echo "syntax=${{ steps.syntax.outcome }}" | tee -a v179-roadmap-test-report.txt
          echo "selftest=${{ steps.selftest.outcome }}" | tee -a v179-roadmap-test-report.txt
          echo "tests=${{ steps.tests.outcome }}" | tee -a v179-roadmap-test-report.txt
          echo "network=${{ steps.network.outcome }}" | tee -a v179-roadmap-test-report.txt
          echo "memory=${{ steps.memory.outcome }}" | tee -a v179-roadmap-test-report.txt
          echo "patch=${{ steps.patch.outcome }}" | tee -a v179-roadmap-test-report.txt
          echo "install=${{ steps.install.outcome }}" | tee -a v179-roadmap-test-report.txt
          bad=0
          for x in '${{ steps.integrity.outcome }}' '${{ steps.deps.outcome }}' '${{ steps.syntax.outcome }}' '${{ steps.selftest.outcome }}' '${{ steps.tests.outcome }}' '${{ steps.network.outcome }}' '${{ steps.memory.outcome }}' '${{ steps.patch.outcome }}' '${{ steps.install.outcome }}'; do
            [ "$x" = success ] || bad=1
          done
          exit $bad

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1.7.9-roadmap-validation-report
          path: v179-roadmap-test-report.txt
