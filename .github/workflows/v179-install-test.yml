name: v1.7.9 Install Test
on:
  push:
    branches: [ debug ]
    paths:
      - '.github/workflows/v179-install-test.yml'
      - 'updates/v1.7.9/**'
      - 'builds/v1.7.8/**'
      - 'builds/v1.7.9/**'
  workflow_dispatch:

jobs:
  install-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug
      - name: Prepare tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip
          chmod +x updates/v1.7.9/build_patch.command updates/v1.7.9/test_install.command
      - name: Run v1.7.8 to v1.7.9 installation test
        run: |
          cd updates/v1.7.9
          ./test_install.command
