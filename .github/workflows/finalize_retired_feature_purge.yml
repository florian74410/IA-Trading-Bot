name: IA-TB Final Purge Validation

on:
  push:
    paths:
      - '.github/workflows/finalize_retired_feature_purge.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove final historical references
        run: python3 .github/repo_ultra_purge_finalize.py
      - name: Validate source syntax and tests
        shell: bash
        run: |
          node --check builds/IA-TB_Build_v1.11.7/Core/Server/server_v1.0.js
          node --check builds/IA-TB_Build_v1.11.7/Core/Admin/admin_backend.js
          node --check builds/IA-TB_Build_v1.11.7/Core/Admin/admin_console.js
          node --check builds/IA-TB_Build_v1.11.7/Core/Admin/log_reader.js
          node --check builds/IA-TB_Build_v1.11.7/Core/Admin/stop_total.js
          node --check builds/IA-TB_Build_v1.11.7/Frontend/JS/admin_controller_v1.0.js
          bash -n builds/IA-TB_Build_v1.11.7/start.command
          bash -n builds/IA-TB_Build_v1.11.7/stop.command
          node builds/IA-TB_Build_v1.11.7/Core/Admin/Tests/test_admin_console.js
      - name: Verify zero current-tree trace and commit
        shell: bash
        run: |
          rm -f .github/cleanup_residual.txt .github/repo_ultra_purge_finalize.py .github/workflows/finalize_retired_feature_purge.yml
          text_matches="$(git grep -In -i 'ultra' -- . || true)"
          path_matches="$(find . -path './.git' -prune -o -iname '*ultra*' -print)"
          if [ -n "$text_matches" ] || [ -n "$path_matches" ]; then
            printf '%s\n' "$text_matches" > .github/final_purge_residual.txt
            printf '%s\n' "$path_matches" >> .github/final_purge_residual.txt
            echo 'Residual references found; diagnostic file will be committed for review.'
          else
            rm -f .github/final_purge_residual.txt
          fi
          git config user.name 'IA-TB Repository Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: finalize retired feature purge and validation'
          git push origin HEAD:main
