name: Finalize v1.7.8 release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/package-v1.7.8.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'

      - name: Validate v1.7.8 source
        run: |
          set -euo pipefail
          test -d builds/v1.7.8
          test -d updates/v1.7.8
          test "$(tr -d '\r\n' < builds/v1.7.8/VERSION)" = "1.7.8"
          node --check builds/v1.7.8/MarketData/Provider/socket_provider.js
          node --check builds/v1.7.8/MarketData/Provider/hyperliquid_provider.js
          node --check builds/v1.7.8/MarketData/Provider/provider_registry.js
          node --check builds/v1.7.8/MarketData/market_data_service.js
          node --check builds/v1.7.8/Frontend/JS/mosaic_controller_v2.9.js
          npm install --prefix builds/v1.7.8/MarketData --ignore-scripts --no-audit --no-fund
          node builds/v1.7.8/MarketData/Tests/test_hyperliquid_socket.js
          rm -rf builds/v1.7.8/MarketData/node_modules builds/v1.7.8/MarketData/package-lock.json

      - name: Build UpdateManager patch
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/iatb-v1.7.8-patch"
          ROOT="$STAGE/Crypto Chart Viewer IA Trader"
          PAYLOAD="$ROOT/payload"
          rm -rf "$STAGE"
          mkdir -p "$PAYLOAD"

          cp -R updates/v1.7.8/Frontend "$PAYLOAD/"
          cp -R updates/v1.7.8/MarketData "$PAYLOAD/"
          cp updates/v1.7.8/install_runtime.command "$PAYLOAD/install_runtime.command"

          mkdir -p "$PAYLOAD/Core/Server"
          cp builds/v1.7.8/Core/Server/server_v1.0.js "$PAYLOAD/Core/Server/server_v1.0.js"
          cp builds/v1.7.8/VERSION "$PAYLOAD/VERSION"
          cp builds/v1.7.8/manifest.json "$PAYLOAD/manifest.json"

          python3 - "$ROOT" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          payload = root / 'payload'
          files = []
          for p in sorted(x for x in payload.rglob('*') if x.is_file()):
              rel = p.relative_to(payload).as_posix()
              h = hashlib.sha256(p.read_bytes()).hexdigest()
              files.append({'path': rel, 'sha256': h})
          manifest = {
              'schema': 1,
              'application': 'Crypto Chart Viewer IA Trader',
              'package_type': 'UPDATE',
              'from_version': '1.7.7',
              'to_version': '1.7.8',
              'payload_root': 'payload',
              'entrypoint': 'Core/Server/server_v1.0.js',
              'description': 'IA-Trading-Bot v1.7.8 - SOCKET Provider, Hyperliquid MarketData et correctif Mosaic',
              'files': files,
          }
          (root / 'update_manifest.json').write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

          rm -f updates/Crypto-Chart-Viewer-IA-Trader-v1.7.8-update.zip updates/Crypto-Chart-Viewer-IA-Trader-v1.7.8-update.zip.sha256
          (cd "$STAGE" && zip -qry "$GITHUB_WORKSPACE/updates/Crypto-Chart-Viewer-IA-Trader-v1.7.8-update.zip" "Crypto Chart Viewer IA Trader")
          shasum -a 256 updates/Crypto-Chart-Viewer-IA-Trader-v1.7.8-update.zip > updates/Crypto-Chart-Viewer-IA-Trader-v1.7.8-update.zip.sha256

      - name: Validate UpdateManager patch archive
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, zipfile
          zpath = 'updates/Crypto-Chart-Viewer-IA-Trader-v1.7.8-update.zip'
          prefix = 'Crypto Chart Viewer IA Trader/'
          with zipfile.ZipFile(zpath) as z:
              names = [n for n in z.namelist() if not n.endswith('/')]
              assert names and all(n.startswith(prefix) for n in names)
              manifest_name = prefix + 'update_manifest.json'
              assert manifest_name in names
              m = json.loads(z.read(manifest_name))
              assert m['schema'] == 1
              assert m['application'] == 'Crypto Chart Viewer IA Trader'
              assert m['package_type'] == 'UPDATE'
              assert m['from_version'] == '1.7.7'
              assert m['to_version'] == '1.7.8'
              assert m['payload_root'] == 'payload'
              assert m['entrypoint'] == 'Core/Server/server_v1.0.js'
              declared = {x['path']: x['sha256'] for x in m['files']}
              payload_names = [n for n in names if n.startswith(prefix + 'payload/')]
              rels = [n[len(prefix + 'payload/'):] for n in payload_names]
              assert set(rels) == set(declared)
              assert m['entrypoint'] in declared
              for rel in rels:
                  got = hashlib.sha256(z.read(prefix + 'payload/' + rel)).hexdigest()
                  assert got == declared[rel], rel
          print('UpdateManager patch validation OK')
          PY

      - name: Package complete v1.7.8 build
        run: |
          set -euo pipefail
          mkdir -p archives
          rm -f archives/IA-Trading-Bot_V1.7.8.zip archives/IA-Trading-Bot_V1.7.8.zip.sha256
          (cd builds && zip -qry ../archives/IA-Trading-Bot_V1.7.8.zip v1.7.8 \
            -x 'v1.7.8/.node/*' \
               'v1.7.8/**/node_modules/*' \
               'v1.7.8/logs.dat' \
               'v1.7.8/user.dat' \
               'v1.7.8/secrets_v2.dat' \
               'v1.7.8/.env' \
               'v1.7.8/.env.*')
          shasum -a 256 archives/IA-Trading-Bot_V1.7.8.zip > archives/IA-Trading-Bot_V1.7.8.zip.sha256
          unzip -tq archives/IA-Trading-Bot_V1.7.8.zip
          unzip -tq updates/Crypto-Chart-Viewer-IA-Trader-v1.7.8-update.zip

      - name: Commit finalized v1.7.8 artifacts
        run: |
          set -euo pipefail
          git config user.name "IA-TB Release Builder"
          git config user.email "actions@users.noreply.github.com"
          git add \
            archives/IA-Trading-Bot_V1.7.8.zip \
            archives/IA-Trading-Bot_V1.7.8.zip.sha256 \
            updates/Crypto-Chart-Viewer-IA-Trader-v1.7.8-update.zip \
            updates/Crypto-Chart-Viewer-IA-Trader-v1.7.8-update.zip.sha256
          git diff --cached --quiet && exit 0
          git commit -m "release: finalize v1.7.8 build and UpdateManager patch"
          git push origin HEAD:main
