name: Auth Phase 2 Password KDF Fixtures

on:
  push:
    branches:
      - feature/debug-2.1-auth-design
    paths:
      - 'App/Core/Clients/password_hasher_v2.js'
      - 'App/Tools/Tests/password_hasher_v2.test.js'
      - '.github/workflows/auth-p2-password-kdf-fixtures.yml'
  pull_request:
    branches:
      - feature/debug-2.1-auth-design
      - debug
    paths:
      - 'App/Core/Clients/password_hasher_v2.js'
      - 'App/Tools/Tests/password_hasher_v2.test.js'
      - '.github/workflows/auth-p2-password-kdf-fixtures.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-password-kdf:
    name: Argon2id native and PBKDF2 fixture tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Code syntax
        run: |
          node --check App/Core/Clients/password_hasher_v2.js
          node --check App/Tools/Tests/password_hasher_v2.test.js
      - name: Install Argon2id native ONLY in an isolated CI temp prefix
        run: |
          npm --prefix "$RUNNER_TEMP/iatb-auth-kdf" install --no-save --no-package-lock --no-audit --no-fund argon2@0.45.1
      - name: Verify native Argon2id + historical PBKDF2 on fictional passwords
        run: |
          NODE_PATH="$RUNNER_TEMP/iatb-auth-kdf/node_modules" node --test App/Tools/Tests/password_hasher_v2.test.js
