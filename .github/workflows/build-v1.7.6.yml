name: Build IA-Trading-Bot v1.7.6

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-v1.7.6.yml"
      - "Update/BUILD_v1.7.6.trigger"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify v1.7.6 patch
        shell: bash
        run: |
          set -euo pipefail
          PATCH6="Update/v1.7.6/Crypto-Chart-Viewer-IA-Trader-v1.7.6-update.zip"
          cat Update/v1.7.6/.package/part_* | base64 --decode > "$PATCH6"
          echo "2417663c44d25077ca6eb40d45753aa6e66ddb19a10e7016b8dc71c0a9d0b465  $PATCH6" | sha256sum -c -

      - name: Verify v1.7.5 patch
        shell: bash
        run: |
          set -euo pipefail
          echo "dc2e8d1da812faa23f2c4cbbd32716348ed3747082508908e68b96b15ae87b84  Update/v1.7.5/Crypto-Chart-Viewer-IA-Trader-v1.7.5-update.zip" | sha256sum -c -

      - name: Apply v1.7.5 and v1.7.6 to current archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .rebuild
          mkdir -p .rebuild/unpacked .rebuild/p175 .rebuild/p176
          unzip -q IA-Trading-Bot_V1.7.4.zip -d .rebuild/unpacked

          APPROOT=".rebuild/unpacked"
          if [ ! -d "$APPROOT/services" ]; then
            shopt -s nullglob dotglob
            children=("$APPROOT"/*)
            shopt -u dotglob
            if [ "${#children[@]}" -eq 1 ] && [ -d "${children[0]}" ]; then
              APPROOT="${children[0]}"
            fi
          fi

          unzip -q Update/v1.7.5/Crypto-Chart-Viewer-IA-Trader-v1.7.5-update.zip -d .rebuild/p175
          unzip -q Update/v1.7.6/Crypto-Chart-Viewer-IA-Trader-v1.7.6-update.zip -d .rebuild/p176
          cp -a .rebuild/p175/. "$APPROOT"/
          cp -a .rebuild/p176/. "$APPROOT"/

          printf "1.7.6\n" > "$APPROOT/VERSION"

          python3 - "$APPROOT" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])

          release = root / "Updates" / "current_release.dat"
          release.parent.mkdir(parents=True, exist_ok=True)
          obj = {}
          if release.exists():
              try:
                  obj = json.loads(release.read_text(encoding="utf-8"))
              except Exception:
                  obj = {}
          obj.update({
              "schema": 1,
              "application": "Crypto Chart Viewer IA Trader",
              "version": "1.7.6",
              "server": "Core/Server/server_v1.0.js"
          })
          release.write_text(json.dumps(obj, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          manifest = root / "manifest.json"
          m = {}
          if manifest.exists():
              try:
                  m = json.loads(manifest.read_text(encoding="utf-8"))
              except Exception:
                  m = {}
          m.update({
              "schema": 1,
              "application": "IA-Trading-Bot",
              "version": "1.7.6",
              "status": "DEV",
              "source_version": "1.7.5",
              "entrypoint": "Core/Server/server_v1.0.js",
              "update_artifact": "Update/v1.7.6/Crypto-Chart-Viewer-IA-Trader-v1.7.6-update.zip"
          })
          manifest.write_text(json.dumps(m, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY

          if [ -f "$APPROOT/start.command" ]; then
            sed -i 's#^[[:space:]]*\./install_runtime\.command[[:space:]]*$#bash "./install_runtime.command"#' "$APPROOT/start.command"
          fi

          find "$APPROOT" -type f \( -name '*.command' -o -name '*.sh' \) -exec chmod 755 {} +

          test -f "$APPROOT/services/fundamental-engine/fundamental-engine.js"
          test -f "$APPROOT/services/trading-engine/trading-engine.js"
          test -f "$APPROOT/services/trading-engine/exchange-adapters/binance/executor.js"
          test -f "$APPROOT/services/trading-engine/exchange-adapters/okx/executor.js"
          test -f "$APPROOT/services/trading-engine/exchange-adapters/kraken/executor.js"
          test -f "$APPROOT/services/trading-engine/exchange-adapters/gmx/executor.js"
          test "$(cat "$APPROOT/VERSION")" = "1.7.6"
          python3 - "$APPROOT" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          assert json.loads((root/'Updates/current_release.dat').read_text())['version'] == '1.7.6'
          assert json.loads((root/'manifest.json').read_text())['version'] == '1.7.6'
          PY
          test -x "$APPROOT/install_runtime.command"
          test -x "$APPROOT/start.command"
          grep -F 'bash "./install_runtime.command"' "$APPROOT/start.command"
          printf '%s\n' "$APPROOT" > .rebuild/app_root.txt

      - name: Validate added engines and shell launchers
        shell: bash
        run: |
          set -euo pipefail
          APPROOT="$(cat .rebuild/app_root.txt)"
          node --check "$APPROOT/services/fundamental-engine/fundamental-engine.js"
          node "$APPROOT/services/fundamental-engine/self-test.js"
          find "$APPROOT/services/trading-engine" -name '*.js' -print0 | xargs -0 -n1 node --check
          node "$APPROOT/services/trading-engine/self-test.js"
          find "$APPROOT" -type f -name '*.command' -print0 | xargs -0 -n1 bash -n

      - name: Build full v1.7.6 archive
        shell: bash
        run: |
          set -euo pipefail
          rm -f IA-Trading-Bot_V1.7.6.zip
          (cd .rebuild/unpacked && zip -qr "$GITHUB_WORKSPACE/IA-Trading-Bot_V1.7.6.zip" .)
          unzip -Z -v IA-Trading-Bot_V1.7.6.zip | grep -A4 'install_runtime.command' || true
          sha256sum IA-Trading-Bot_V1.7.6.zip | tee Update/v1.7.6/FULL_ARCHIVE_SHA256.txt
          printf "1.7.6\n" > VERSION

      - name: Publish full v1.7.6 archive
        uses: actions/upload-artifact@v4
        with:
          name: IA-Trading-Bot_V1.7.6
          path: IA-Trading-Bot_V1.7.6.zip
          if-no-files-found: error
          retention-days: 30

      - name: Commit corrected v1.7.6 archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION IA-Trading-Bot_V1.7.6.zip \
            Update/v1.7.6/Crypto-Chart-Viewer-IA-Trader-v1.7.6-update.zip \
            Update/v1.7.6/FULL_ARCHIVE_SHA256.txt
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "fix: replace defective IA-Trading-Bot v1.7.6 archive"
          git push origin HEAD:main
