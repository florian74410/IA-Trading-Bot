name: Fix README architecture SVG

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-readme-architecture-svg.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Update README image source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          old = '<img src="./docs/assets/app_architecture.jpg" alt="IA-Trading-Bot architecture" width="100%" />'
          new = '<img src="./docs/assets/app_architecture.svg" alt="IA-Trading-Bot architecture" width="100%" />'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Architecture image tag not found')
          p.write_text(s, encoding='utf-8')
          PY
          grep -F '<img src="./docs/assets/app_architecture.svg" alt="IA-Trading-Bot architecture" width="100%" />' README.md
      - name: Commit and cleanup
        run: |
          rm -f .github/workflows/fix-readme-architecture-svg.yml
          git config user.name 'IA-TB Asset Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md .github/workflows/fix-readme-architecture-svg.yml
          git commit -m 'docs: use app architecture SVG in README'
          git push origin HEAD:main
