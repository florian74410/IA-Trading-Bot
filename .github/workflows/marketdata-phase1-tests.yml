name: MarketData Shadow Contract Tests

on:
  push:
    branches:
      - feature/data-policy-orchestrator-v1
  workflow_dispatch:

jobs:
  marketdata-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 16.20.2
        uses: actions/setup-node@v4
        with:
          node-version: 16.20.2

      - name: Runtime version
        run: node --version

      - name: API Request Orchestrator Shadow v1
        run: node builds/IA-TB_Build_v2.0_DEBUG/MarketData/Tests/test_api_request_orchestrator_shadow_v1.js

      - name: Phase 1 Provider Profiles
        run: node builds/IA-TB_Build_v2.0_DEBUG/MarketData/Tests/test_phase1_provider_profiles_v1.js

      - name: Provider Passport Registry
        run: node builds/IA-TB_Build_v2.0_DEBUG/MarketData/Tests/test_provider_passports_v1.js

      - name: UNKNOWN Quota Non-Blocking
        run: node builds/IA-TB_Build_v2.0_DEBUG/MarketData/Tests/test_unknown_quota_nonblocking_v1.js

      - name: Phase 2 Weighted Budget
        run: node builds/IA-TB_Build_v2.0_DEBUG/MarketData/Tests/test_phase2_weighted_budget_v1.js

      - name: Phase 3 Special Limits
        run: node builds/IA-TB_Build_v2.0_DEBUG/MarketData/Tests/test_phase3_special_limits_v1.js

      - name: Transport Budget Bridge
        run: node builds/IA-TB_Build_v2.0_DEBUG/MarketData/Tests/test_transport_budget_bridge_v1.js

      - name: Shadow Decision Engine
        run: node builds/IA-TB_Build_v2.0_DEBUG/MarketData/Tests/test_shadow_decision_engine_v1.js

      - name: Alternate Provider Policy
        run: node builds/IA-TB_Build_v2.0_DEBUG/MarketData/Tests/test_alternate_provider_policy_v1.js

      - name: Reference Fiat Registry
        run: node builds/IA-TB_Build_v2.0_DEBUG/MarketData/Tests/test_reference_fiat_registry_v1.js

      - name: DeFiLlama Public Surface
        run: node builds/IA-TB_Build_v2.0_DEBUG/MarketData/Tests/test_defillama_public_surface_v2.js

      - name: Market Data Collector Lock
        run: node builds/IA-TB_Build_v2.0_DEBUG/MarketData/Tests/test_market_data_collector_v2_lock.js

      - name: Financial Data Contract
        run: node builds/IA-TB_Build_v2.0_DEBUG/MarketData/Tests/test_financial_data_contract_v2.js

      - name: Financial Async Fast Lane
        run: node builds/IA-TB_Build_v2.0_DEBUG/MarketData/Tests/test_financial_async_fastlane_v1.js

      - name: Financial Family Scheduler
        run: node builds/IA-TB_Build_v2.0_DEBUG/MarketData/Tests/test_financial_family_scheduler_v1.js

      - name: Native-Lite Dedup Trust Boundary
        run: node builds/IA-TB_Build_v2.0_DEBUG/MarketData/Tests/test_native_lite_cache_dedup_v1.js

      - name: Native-Lite Data Integrity
        run: node builds/IA-TB_Build_v2.0_DEBUG/MarketData/Tests/test_native_lite_data_integrity_v1.js

      - name: Firewall Cache Boundary
        run: node builds/IA-TB_Build_v2.0_DEBUG/MarketData/Tests/test_firewall_cache_boundary_v1.js

      - name: CEX Provider Contract
        run: node builds/IA-TB_Build_v2.0_DEBUG/MarketData/Tests/test_cex_providers_v2.js

      - name: Liquidity Pipeline Contract
        run: node builds/IA-TB_Build_v2.0_DEBUG/MarketData/Tests/test_liquidity_pipeline_v1.js

      - name: Market Data V2 Debug
        run: node builds/IA-TB_Build_v2.0_DEBUG/MarketData/Tests/market_data_v2_debug.js
