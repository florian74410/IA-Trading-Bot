<svg xmlns="http://www.w3.org/2000/svg" width="2630" height="3300" viewBox="0 0 2630 3300" role="img" aria-labelledby="title desc">
<title id="title">IA-TB — Architecture fonctionnelle</title>
<desc id="desc">Architecture IA-TB. Market Data vers Supervisor; Portfolio vers Supervisor; Supervisor bidirectionnel Router; Strategy Engine, Trading Engine, Indicator Engine et Fundamental Engine bidirectionnels avec Router; Trading Engine vers Risk Manager vers Exchanges; Exchanges vers Market Data; Market Data vers Chart Viewer.</desc>
