<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#03111c"/><stop offset="1" stop-color="#071f31"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1400" height="760" rx="28" fill="url(#bg)"/><text x="70" y="80" fill="#e9f8ff" font-family="Arial" font-size="38" font-weight="700">IA-TB Bank — couche de gestion des wallets</text><text x="70" y="118" fill="#79abc4" font-family="Arial" font-size="20">Un compte utilisateur · plusieurs wallets internes · services bancaires crypto unifiés</text><g font-family="Arial"><rect x="70" y="180" width="260" height="150" rx="20" fill="#071b29" stroke="#1ab9ff"/><text x="100" y="225" fill="#37caff" font-size="24">👤 Utilisateur</text><text x="100" y="265" fill="#d7eef8" font-size="18">Compte IA-TB</text><text x="100" y="295" fill="#789caf" font-size="15">Identité → ownerId</text><path d="M330 255H430" stroke="#25d7b1" stroke-width="4" marker-end="url(#a)"/><rect x="430" y="160" width="360" height="190" rx="22" fill="#071b29" stroke="#168fff"/><text x="465" y="205" fill="#eaf8ff" font-size="26" font-weight="700">🏦 Banque IA-TB</text><text x="465" y="245" fill="#9bc2d5" font-size="16">Surcouche de gestion</text><text x="465" y="278" fill="#9bc2d5" font-size="16">Création · affichage · archivage</text><text x="465" y="311" fill="#9bc2d5" font-size="16">Transfert · Swap · Bridge</text><path d="M790 255H890" stroke="#25d7b1" stroke-width="4"/><rect x="890" y="145" width="430" height="220" rx="22" fill="#071b29" stroke="#8b5cff"/><text x="925" y="192" fill="#d9c7ff" font-size="25" font-weight="700">🔐 Wallets de l’utilisateur</text><text x="925" y="235" fill="#d7eef8" font-size="17">Wallet A · Ethereum</text><text x="925" y="270" fill="#d7eef8" font-size="17">Wallet B · Arbitrum</text><text x="925" y="305" fill="#d7eef8" font-size="17">Wallet C · Polygon</text><text x="925" y="338" fill="#789caf" font-size="14">Clés privées chiffrées · clés publiques récupérables</text><rect x="80" y="440" width="250" height="150" rx="18" fill="#061a28" stroke="#1a7eb1"/><text x="110" y="485" fill="#46cfff" font-size="21">⇄ Transferts</text><text x="110" y="522" fill="#a8c8d8" font-size="15">Wallet → Wallet</text><text x="110" y="550" fill="#a8c8d8" font-size="15">Wallet → externe</text><rect x="360" y="440" width="250" height="150" rx="18" fill="#061a28" stroke="#1a7eb1"/><text x="390" y="485" fill="#46cfff" font-size="21">🔁 Swap & Bridge</text><text x="390" y="522" fill="#a8c8d8" font-size="15">Token → Token</text><text x="390" y="550" fill="#a8c8d8" font-size="15">Réseau → Réseau</text><rect x="640" y="440" width="250" height="150" rx="18" fill="#061a28" stroke="#1a7eb1"/><text x="670" y="485" fill="#46cfff" font-size="21">💰 Dépôt / Prêt</text><text x="670" y="525" fill="#789caf" font-size="15">Service prévu</text><rect x="920" y="440" width="330" height="150" rx="18" fill="#061a28" stroke="#1a7eb1"/><text x="950" y="485" fill="#46cfff" font-size="21">◈ Pools & Vault Strategies</text><text x="950" y="525" fill="#789caf" font-size="15">Rendement et stratégies</text><path d="M610 350V405H205V440M610 405H485V440M610 405H765V440M610 405H1085V440" fill="none" stroke="#155d7e" stroke-width="3"/><rect x="430" y="645" width="540" height="60" rx="16" fill="#082336" stroke="#20d7b1"/><text x="700" y="682" text-anchor="middle" fill="#bff9e9" font-size="17">La Banque simplifie l’usage ; la propriété reste liée aux clés du wallet.</text></g></svg>