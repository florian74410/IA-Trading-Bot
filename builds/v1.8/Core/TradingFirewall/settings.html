<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trading Firewall</title><style>body{margin:0;padding:14px;background:#071018;color:#d9e9f5;font:13px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}h2{margin:0 0 12px;color:#ffc85a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#0c1822;border:1px solid #243948;border-radius:8px;padding:12px}label{display:block;margin:8px 0;color:#9fb8c9}input,select,textarea{box-sizing:border-box;width:100%;background:#081219;color:#d9e9f5;border:1px solid #345267;border-radius:5px;padding:7px}input[type=checkbox]{width:auto}.row{display:flex;gap:10px;align-items:center}.row label{flex:1}button{background:#17384f;color:#d9e9f5;border:1px solid #3e6680;border-radius:6px;padding:8px 12px;cursor:pointer}.msg{margin-top:10px;color:#54d89b;font:12px Menlo,monospace}.small{color:#86a3b7;font-size:11px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><h2>Trading Firewall · v1.8 DEV</h2><div class="small">Protection des communications Supervisor → Trading Engine. Ce firewall ne calcule pas le risque et ne fabrique aucune autorisation de risque.</div><div class="grid"><div class="card"><div class="row"><label><input id="enabled" type="checkbox"> Activé</label><label>Mode<select id="mode"><option>PROTECTION</option><option>OBSERVATION</option></select></label></div><label><input id="cp" type="checkbox"> Vérifier authentification CP/1</label><label><input id="sig" type="checkbox"> Vérifier signature HMAC</label><label>Âge maximal du message (s)<input id="age" type="number" min="1" max="300"></label><label><input id="dup" type="checkbox"> Protection anti-doublon</label><label>Fenêtre anti-doublon (s)<input id="win" type="number" min="1" max="600"></label></div><div class="card"><label><input id="cmdOn" type="checkbox"> Whitelist commandes</label><label>Commandes autorisées<textarea id="cmd" rows="6"></textarea></label><label><input id="pairOn" type="checkbox"> Whitelist paires</label><label>Paires autorisées<textarea id="pairs" rows="5"></textarea></label></div></div><p><button id="save">Enregistrer</button> <button id="reload">Recharger</button></p><div id="msg" class="msg">Chargement…</div><script>(function(){'use strict';function q(id){return document.getElementById(id)}function api(u,o){return fetch(u,o).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j})})}function lines(v){return String(v||'').split(/\n|,/).map(function(x){return x.trim()}).filter(Boolean)}function load(){api('/api/settings').then(function(x){var s=x.settings||{};q('enabled').checked=s.enabled!==false;q('mode').value=s.mode||'PROTECTION';q('cp').checked=!!(s.security&&s.security.verifyCpAuthentication);q('sig').checked=!!(s.security&&s.security.verifySignatures);q('age').value=s.security&&s.security.maxMessageAgeSeconds||30;q('dup').checked=!!(s.duplicateProtection&&s.duplicateProtection.enabled);q('win').value=s.duplicateProtection&&s.duplicateProtection.windowSeconds||30;q('cmdOn').checked=!!(s.commandWhitelist&&s.commandWhitelist.enabled);q('cmd').value=(s.commandWhitelist&&s.commandWhitelist.allowed||[]).join('\n');q('pairOn').checked=!!(s.tradingPairWhitelist&&s.tradingPairWhitelist.enabled);q('pairs').value=(s.tradingPairWhitelist&&s.tradingPairWhitelist.allowed||[]).join('\n');q('msg').textContent='Configuration chargée.'}).catch(function(e){q('msg').textContent='Erreur: '+e.message})}q('reload').onclick=load;q('save').onclick=function(){var s={enabled:q('enabled').checked,mode:q('mode').value,security:{verifyCpAuthentication:q('cp').checked,verifySignatures:q('sig').checked,maxMessageAgeSeconds:+q('age').value||30},duplicateProtection:{enabled:q('dup').checked,windowSeconds:+q('win').value||30},commandWhitelist:{enabled:q('cmdOn').checked,allowed:lines(q('cmd').value)},tradingPairWhitelist:{enabled:q('pairOn').checked,allowed:lines(q('pairs').value)}};api('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(s)}).then(function(){q('msg').textContent='Enregistré.';load()}).catch(function(e){q('msg').textContent='Erreur: '+e.message})};load();})();</script></body></html>
