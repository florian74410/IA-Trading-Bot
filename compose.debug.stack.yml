# IA-TB GEN-1 DEBUG service split — REVIEW FIRST, do not 'up' without approval.
# Deliberately no published ports and no external network; only loopback is shared.
# No Trading Engine or other engines are present.
name: iatb-debug-stack

x-iatb-base: &iatb-base
  image: iatb:node22-app-validation
  user: "${IATB_UID:?Export IATB_UID}:${IATB_GID:?Export IATB_GID}"
  read_only: true
  restart: "no"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  volumes:
    - /var/lib/iatb/debug/runtime:/iatb/debug/runtime:rw
    - /var/lib/iatb/debug/data:/iatb/debug/data:rw
    - /var/lib/iatb/debug/state:/iatb/debug/state:rw
    - /var/lib/iatb/debug/annexes:/iatb/debug/annexes:rw
    - /var/lib/iatb/debug/updates:/iatb/debug/updates:rw
  environment: &iatb-env
    IATB_RUNTIME_ROOT: /iatb/debug/runtime
    IATB_DATA_ROOT: /iatb/debug/data
    IATB_STATE_ROOT: /iatb/debug/state
    IATB_ANNEX_ROOT: /iatb/debug/annexes
    IATB_UPDATES_ROOT: /iatb/debug/updates
    IATB_TRADING_LIVE: "0"
    IATB_DEBUG_BOOTSTRAP: "0"
    IATB_DEBUG_MODE: "0"
    IATB_AUTH_MODE: disabled
    ROUTER_PORT: "8021"
    CORE_PUBLIC_PORT: "8001"
    IATB_UI_PORT: "8000"

services:
  router:
    <<: *iatb-base
    profiles: ["manual-stack"]
    build:
      context: ./App
      dockerfile: Dockerfile.app
    command: ["node", "Core/Router/router.js"]
    network_mode: "none"

  core:
    <<: *iatb-base
    profiles: ["manual-stack"]
    command: ["node", "Core/Server/server.js"]
    network_mode: "service:router"
    depends_on:
      router:
        condition: service_started

  ui:
    <<: *iatb-base
    profiles: ["manual-stack"]
    command: ["node", "UI/Gateway/ui_service.js"]
    network_mode: "service:router"
    depends_on:
      router:
        condition: service_started
      core:
        condition: service_started
