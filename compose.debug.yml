# IA-TB GEN-1 DEBUG — safe validation profile only.
# This file deliberately does not start application services or publish ports.
# Full service orchestration will be enabled only after auth and path audits.
name: iatb-debug

services:
  preflight:
    profiles: ["validate"]
    build:
      context: ./App
      dockerfile: Dockerfile.app
    image: iatb:node22-app-validation
    network_mode: "none"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777
    environment:
      IATB_RUNTIME_ROOT: /tmp/iatb-debug/runtime
      IATB_DATA_ROOT: /tmp/iatb-debug/data
      IATB_STATE_ROOT: /tmp/iatb-debug/state
      IATB_TRADING_LIVE: "0"
    restart: "no"

  storage-check:
    profiles: ["storage"]
    build:
      context: ./App
      dockerfile: Dockerfile.app
    image: iatb:node22-app-validation
    command: ["node", "Tools/storage_preflight.js"]
    network_mode: "none"
    read_only: true
    user: "${IATB_UID:?Set IATB_UID to id -u}:${IATB_GID:?Set IATB_GID to id -g}"
    volumes:
      - /var/lib/iatb/debug/runtime:/iatb/debug/runtime:rw
      - /var/lib/iatb/debug/data:/iatb/debug/data:rw
      - /var/lib/iatb/debug/state:/iatb/debug/state:rw
      - /var/lib/iatb/debug/annexes:/iatb/debug/annexes:rw
      - /var/lib/iatb/debug/updates:/iatb/debug/updates:rw
    environment:
      IATB_RUNTIME_ROOT: /iatb/debug/runtime
      IATB_DATA_ROOT: /iatb/debug/data
      IATB_STATE_ROOT: /iatb/debug/state
      IATB_ANNEX_ROOT: /iatb/debug/annexes
      IATB_UPDATES_ROOT: /iatb/debug/updates
      IATB_TRADING_LIVE: "0"
      IATB_DEBUG_BOOTSTRAP: "0"
    restart: "no"
