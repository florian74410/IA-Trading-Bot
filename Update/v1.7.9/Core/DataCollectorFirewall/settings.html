<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data Collector Firewall</title>
<style>
body{margin:0;background:#0b1016;color:#d8e2ef;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{padding:14px}.top{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.badge{padding:4px 9px;border:1px solid #31445a;border-radius:999px;background:#111a24}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:10px;margin-top:12px}.card{background:#111923;border:1px solid #26384b;border-radius:10px;padding:12px}.card h3{margin:0 0 9px;font-size:14px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:7px 0}.row label{flex:1}.row input[type=number]{width:110px}.row input[type=text],textarea,select{background:#081018;color:#d8e2ef;border:1px solid #31445a;border-radius:6px;padding:6px}textarea{width:100%;min-height:100px;box-sizing:border-box;font-family:monospace}.wide{grid-column:1/-1}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{background:#192b3d;color:#e8f3ff;border:1px solid #365776;border-radius:7px;padding:7px 10px;cursor:pointer}button:hover{background:#213a52}.ok{color:#7fe2a5}.warn{color:#ffd27a}.bad{color:#ff8f8f}pre{white-space:pre-wrap;max-height:260px;overflow:auto;background:#071018;border:1px solid #26384b;padding:9px;border-radius:7px}.small{font-size:11px;color:#8fa4ba}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <strong>🛡 Data Collector Firewall</strong>
    <span id="state" class="badge">chargement…</span>
    <label>Mode <select id="mode"><option>PROTECTION</option><option>OBSERVATION</option></select></label>
    <label><input id="enabled" type="checkbox"> Firewall ON</label>
  </div>
  <div class="grid">
    <div class="card"><h3>Validation générale</h3><div id="rulesGeneral"></div></div>
    <div class="card"><h3>Seuils</h3>
      <div class="row"><label>Âge max message (ms)</label><input id="maxMessageAgeMs" type="number" min="1000"></div>
      <div class="row"><label>Décalage futur max (ms)</label><input id="maxFutureSkewMs" type="number" min="0"></div>
      <div class="row"><label>Taille max payload (bytes)</label><input id="maxPayloadBytes" type="number" min="1024"></div>
      <div class="row"><label>Fenêtre doublon (ms)</label><input id="duplicateWindowMs" type="number" min="0"></div>
      <div class="row"><label>Saut prix max (%)</label><input id="maxPriceJumpPct" type="number" min="0" step="0.1"></div>
      <div class="row"><label>Spread max (%)</label><input id="maxSpreadPct" type="number" min="0" step="0.1"></div>
    </div>
    <div class="card"><h3>Whitelist Providers</h3><textarea id="providers" placeholder="Un provider par ligne"></textarea></div>
    <div class="card"><h3>Whitelist Types</h3><textarea id="types" placeholder="Un type par ligne"></textarea></div>
    <div class="card wide"><h3>Debug depuis Settings</h3><div class="small">Le debug utilise exactement le même moteur de validation que le flux réel.</div><textarea id="sample"></textarea><div class="buttons"><button id="inspect">Inspecter ce message</button><button id="selftest">Auto-test Firewall</button><button id="reset">Réinitialiser stats</button></div><pre id="debug">--</pre></div>
  </div>
  <div class="buttons"><button id="save">Enregistrer tous les réglages</button><button id="reload">Recharger</button></div>
  <div id="msg" class="small"></div>
</div>
<script>
(function(){
var ruleIds=['payloadSize','providerWhitelist','typeWhitelist','provenance','timestamp','symbol','ohlcSchema','positivePrice','priceJump','bidAsk','spread','duplicateProtection'];
var labels={payloadSize:'Contrôle taille payload',providerWhitelist:'Whitelist provider',typeWhitelist:'Whitelist type',provenance:'Provenance obligatoire',timestamp:'Fraîcheur / timestamp',symbol:'Validation paire / symbole',ohlcSchema:'Schéma + invariants OHLCV',positivePrice:'Prix strictement positif',priceJump:'Saut de prix',bidAsk:'Cohérence Bid / Ask',spread:'Spread maximal',duplicateProtection:'Anti-doublon'};
var $=function(x){return document.getElementById(x)};
function api(p,o){o=o||{};o.headers=o.headers||{};if(o.body&&typeof o.body!=='string'){o.headers['content-type']='application/json';o.body=JSON.stringify(o.body)}return fetch(p,o).then(function(r){return r.json().then(function(j){if(!r.ok&&r.status!==422)throw new Error(j.error||('HTTP '+r.status));return j})})}
function ruleUI(){var h='';ruleIds.forEach(function(id){h+='<div class="row"><label>'+labels[id]+'</label><input id="r_'+id+'" type="checkbox"></div>'});$('rulesGeneral').innerHTML=h}
function apply(s){s=s.firewall||s;$('enabled').checked=!!s.enabled;$('mode').value=s.mode||'PROTECTION';ruleIds.forEach(function(id){$('r_'+id).checked=!!(s.rules&&s.rules[id])});['maxMessageAgeMs','maxFutureSkewMs','maxPayloadBytes','duplicateWindowMs','maxPriceJumpPct','maxSpreadPct'].forEach(function(k){$(k).value=s[k]});$('providers').value=(s.providerWhitelist||[]).join('\n');$('types').value=(s.typeWhitelist||[]).join('\n');var st=s.stats||{};$('state').textContent=(s.enabled?'ON':'OFF')+' · '+(s.mode||'')+' · pass '+(st.passed||0)+' / reject '+(st.rejected||0);$('state').className='badge '+(s.enabled?'ok':'warn')}
function load(){return api('/status').then(apply).catch(function(e){$('state').textContent='Erreur '+e.message;$('state').className='badge bad'})}
function lines(id){return $(id).value.split(/\r?\n|,/).map(function(x){return x.trim().toUpperCase()}).filter(Boolean)}
function save(){var rules={};ruleIds.forEach(function(id){rules[id]=$('r_'+id).checked});var b={enabled:$('enabled').checked,mode:$('mode').value,rules:rules,maxMessageAgeMs:+$('maxMessageAgeMs').value,maxFutureSkewMs:+$('maxFutureSkewMs').value,maxPayloadBytes:+$('maxPayloadBytes').value,duplicateWindowMs:+$('duplicateWindowMs').value,maxPriceJumpPct:+$('maxPriceJumpPct').value,maxSpreadPct:+$('maxSpreadPct').value,requireProvenance:$('r_provenance').checked,providerWhitelist:lines('providers'),typeWhitelist:lines('types')};$('msg').textContent='Enregistrement…';return api('/configure',{method:'POST',body:b}).then(function(x){apply(x.firewall);$('msg').textContent='Réglages enregistrés dans Parametres/data_collector_firewall.json'}).catch(function(e){$('msg').textContent='Erreur: '+e.message})}
ruleUI();
$('sample').value=JSON.stringify({provider:'KRAKEN',source:'KRAKEN',type:'OHLCV',symbol:'BTC/EUR',timestamp:Date.now(),data:[[Date.now(),100,110,90,105,12]]},null,2);
$('save').onclick=save;$('reload').onclick=load;
$('inspect').onclick=function(){var o;try{o=JSON.parse($('sample').value)}catch(e){$('debug').textContent='JSON invalide: '+e.message;return}api('/inspect',{method:'POST',body:o}).then(function(x){$('debug').textContent=JSON.stringify(x,null,2);load()}).catch(function(e){$('debug').textContent=e.message})};
$('selftest').onclick=function(){api('/debug/self-test',{method:'POST',body:{}}).then(function(x){$('debug').textContent=JSON.stringify(x,null,2);load()})};
$('reset').onclick=function(){api('/debug/reset',{method:'POST',body:{}}).then(function(x){$('debug').textContent=JSON.stringify(x,null,2);load()})};
load();
})();
</script>
</body>
</html>
